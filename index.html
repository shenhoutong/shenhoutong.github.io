<style>
/* ===== 顏色與大小（Design tokens） ===== */
:root {
  --paper: #F2F2EA;      /* 背景：竹紙 bamboo paper */
  --surface: #FFFEF9;    /* 面板：素白 warm white panels */
  --ink: #2A2C27;        /* 主要文字：墨 main text */
  --ink-2: #585B51;      /* 次要文字 secondary text */
  --line: #DCDCCF;       /* 線 lines */
  --line-strong: #7F8A78; /* 按鈕外框（對比 3:1 以上） button outlines */
  --danger: #A3392B;     /* 確定清除：印泥紅 destructive */
  --danger-ink: #FFFFFF;
  --accent: #3E5E44;     /* 主色：松綠 primary */
  --accent-ink: #FFFFFF;
  --accent-soft: #E4EBDD;
  --hinoki: #A87A30;     /* 點綴：檜木 decorative accent */
  --caution-bg: #F9EFD8; /* 先不要做 */
  --caution-line: #D9A748;
  --caution-ink: #5A3D06;
  --late: #A3392B;       /* 已超過期限 overdue */
  --late-bg: #F8E6E0;
  --focus: #1F5FAF;
  --note-bg: rgba(255, 255, 255, .35); /* 聲明框底色 note box */
  --shadow: 0 1px 0 rgba(70, 66, 40, .05), 0 10px 24px -18px rgba(70, 66, 40, .45); /* 面板的淡陰影 soft panel shadow */
  /* 標題用明體，比較有溫度；手機沒有明體時會用一般字體 Ming/serif headings, falls back to sans */
  --serif: "Noto Serif TC", "Noto Serif CJK TC", "Source Han Serif TC", "Songti TC", "PMingLiU", serif;
  --scale: 1;            /* 字放大倍數 font scale */
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #161914;
    --surface: #1F231D;
    --ink: #E9E8DE;
    --ink-2: #B4B5A8;
    --line: #363B33;
    --line-strong: #7F8B79;
    --danger: #F2A497;
    --danger-ink: #2A0F0B;
    --accent: #A8C8A0;
    --accent-ink: #12190F;
    --accent-soft: #26301F;
    --hinoki: #D2A95E;
    --shadow: 0 1px 0 rgba(0, 0, 0, .2);
    --note-bg: rgba(255, 255, 255, .04);
    --caution-bg: #2E2512;
    --caution-line: #8C6E2E;
    --caution-ink: #F0D9A6;
    --late: #F2A497;
    --late-bg: #3A2420;
    --focus: #8DB8F2;
    color-scheme: dark;
  }
}
/* 手動指定深色時也套用 Also apply when dark is set explicitly */
:root[data-theme="dark"] {
    --paper: #161914;
    --surface: #1F231D;
    --ink: #E9E8DE;
    --ink-2: #B4B5A8;
    --line: #363B33;
    --line-strong: #7F8B79;
    --accent: #A8C8A0;
    --accent-ink: #12190F;
    --accent-soft: #26301F;
    --hinoki: #D2A95E;
    --shadow: 0 1px 0 rgba(0, 0, 0, .2);
    --note-bg: rgba(255, 255, 255, .04);
    --caution-bg: #2E2512;
    --caution-line: #8C6E2E;
    --caution-ink: #F0D9A6;
    --late: #F2A497;
    --late-bg: #3A2420;
    --focus: #8DB8F2;
    color-scheme: dark;
  }


/* ===== 基本設定（Base） ===== */
/* iOS：跟著手機的「文字大小」設定 Follow iOS Dynamic Type */
@supports (font: -apple-system-body) { html { font: -apple-system-body; } }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif;
  font-size: calc(1.125rem * var(--scale));
  line-height: 1.75;
  overflow-wrap: anywhere;
  text-spacing-trim: space-all; /* v3.8：全形標點不縮，行尾括號才不會凸出畫面 no punctuation trimming, so line-end brackets never stick out */
}
a { color: var(--accent); text-underline-offset: .2em; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: .3em; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ===== 上方列（Top bar） ===== */
.topbar {
  position: sticky; top: 0; z-index: 5;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top);
}
.topbar-in {
  font-size: 1rem; /* 上方列不跟著工具內的字放大，避免擠在一起 keep the bar compact */
  max-width: 38em; margin: 0 auto; padding: .35em 16px;
  display: flex; align-items: center; justify-content: space-between; gap: .5em;
}
.brand { display: flex; align-items: center; gap: .4em; font-family: var(--serif); font-weight: 700; font-size: 1.08em; letter-spacing: .12em; color: var(--ink); text-decoration: none; padding: .3em 0; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.brand svg { flex: none; width: 1.5em; height: 1.5em; color: var(--accent); }
.font-btn {
  flex: none; font: inherit; font-size: 1.05em; color: var(--ink);
  background: var(--surface); border: 1.5px solid var(--line-strong); border-radius: 2em;
  min-height: 2.6em; padding: .2em 1em; cursor: pointer; white-space: nowrap;
}

/* ===== 版面（Layout） ===== */
main { display: block; outline: none; }
.wrap { max-width: 38em; margin: 0 auto; padding: 1.2em 16px calc(2.5em + env(safe-area-inset-bottom)); }
h1 { font-family: var(--serif); font-weight: 700; font-size: 1.55em; line-height: 1.4; margin: .2em 0 .5em; letter-spacing: .04em; }
h1:focus { outline: none; }
h2 { font-family: var(--serif); font-weight: 700; font-size: 1.16em; line-height: 1.5; margin: 1.7em 0 .45em; letter-spacing: .03em; }
p { margin: .5em 0; }
.muted { color: var(--ink-2); }
.small { font-size: .9em; }
.lead { font-size: 1.08em; }
.stack > * + * { margin-top: .75em; }

/* ===== 按鈕（Buttons） ===== */
.btn {
  display: flex; align-items: center; justify-content: center; gap: .4em;
  width: 100%; min-height: 3.1em; padding: .55em 1em;
  border-radius: 14px; border: 2px solid transparent;
  font: inherit; font-weight: 700; letter-spacing: .04em; text-align: center; cursor: pointer;
  text-decoration: none;
}
.btn-primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 2px 0 rgba(30, 45, 30, .18); }
.btn-primary:active { transform: translateY(1px); box-shadow: none; }
.btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
.btn-danger { background: var(--danger); color: var(--danger-ink); }
.btn-text {
  display: inline-flex; align-items: center; min-height: 2.75em;
  background: none; border: 0; padding: .3em .1em; font: inherit;
  color: var(--accent); text-decoration: underline; text-underline-offset: .2em; cursor: pointer;
}
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: .7em; }
@media (max-width: 22em) { .btn-row { grid-template-columns: 1fr; } }

/* ===== 開始頁（Welcome） ===== */
.welcome h1 { font-size: 2em; margin: .1em 0 .1em; letter-spacing: .1em; }
.welcome .comfort { font-family: var(--serif); font-size: 1.3em; line-height: 1.6; color: var(--accent); margin: .1em 0 .9em; letter-spacing: .05em; }
.hero-art { display: block; width: 7.5em; height: auto; margin: .8em 0 .2em -.3em; }
.note-box {
  background: var(--note-bg); border: 1px solid var(--line); border-radius: 14px;
  padding: .8em 1em; color: var(--ink-2); font-size: .95em;
}

/* ===== 問題頁（Questions） ===== */
.progress-text { color: var(--ink-2); font-size: .95em; margin: 0 0 .3em; }
.progress { height: .45em; background: var(--line); border-radius: 1em; overflow: hidden; margin-bottom: 1.2em; }
.progress > span { display: block; height: 100%; background: var(--accent); border-radius: 1em; }
.q-hint { color: var(--ink-2); margin: -.2em 0 1em; }
.opts { display: grid; gap: .7em; margin: 0; padding: 0; border: 0; }
.opt {
  display: flex; align-items: center; gap: .85em;
  width: 100%; min-height: 3.3em; padding: .7em 1em;
  background: var(--surface); color: var(--ink);
  border: 2px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  font: inherit; text-align: left; cursor: pointer;
}
.opt .mark {
  flex: none; width: 1.45em; height: 1.45em; border-radius: 50%;
  border: 2px solid var(--ink-2); display: grid; place-items: center;
}
.opt.multi .mark { border-radius: .35em; }
.opt[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.opt[aria-checked="true"] .mark { background: var(--accent); border-color: var(--accent); }
.opt[aria-checked="true"] .mark::after {
  content: ""; width: .38em; height: .7em; margin-top: -.12em;
  border: solid var(--accent-ink); border-width: 0 .17em .17em 0; transform: rotate(45deg);
}
.date-grid { display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: .6em; }
.field label { display: block; font-weight: 700; margin-bottom: .2em; }
select {
  width: 100%; min-height: 3em; font: inherit; color: var(--ink);
  background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: .3em .5em;
}
.error {
  color: var(--late); background: var(--late-bg); border-radius: .6em;
  padding: .6em .9em; font-weight: 700; margin: .8em 0 0;
}
.q-actions { margin-top: 1.4em; display: grid; gap: .6em; }
.back-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .5em; margin-top: .8em; }

/* ===== 清單頁（List） ===== */
.summary { margin: 0 0 1em; }
.done-count { display: flex; align-items: center; gap: .8em; margin: .8em 0 1.2em; }
.done-count .bar { flex: 1; height: .45em; background: var(--line); border-radius: 1em; overflow: hidden; }
.done-count .bar > span { display: block; height: 100%; background: var(--accent); }
.storage-warn { background: var(--caution-bg); color: var(--caution-ink); border-radius: .6em; padding: .6em .9em; font-size: .92em; margin-bottom: 1em; }

.caution {
  background: var(--caution-bg); color: var(--caution-ink);
  border: 1px solid var(--caution-line); border-left-width: .35em; border-radius: 14px;
  padding: .7em 1em .5em; margin-bottom: 1.8em;
}
.caution h2 { margin: .1em 0 .2em; color: var(--caution-ink); font-size: 1.12em; }
.caution details { border-top: 1px solid var(--caution-line); }
.caution details:first-of-type { border-top: 0; }
.caution summary {
  cursor: pointer; padding: .55em 0; list-style: none; display: flex; gap: .5em; font-weight: 700;
}
.caution summary::-webkit-details-marker { display: none; }
.caution summary::before { content: "＋"; flex: none; }
.caution details[open] summary::before { content: "－"; }
.caution .detail-body { padding: 0 0 .7em 1.5em; font-weight: 400; }
.caution .dont-head { display: block; }
.caution .dont-title { display: block; }
.caution .dont-why { display: block; font-weight: 400; font-size: .92em; margin-top: .15em; }
.caution .detail-body ul { padding-left: 1.2em; margin: .3em 0; }
.caution .detail-body li { margin: .2em 0; }
.caution a { color: var(--caution-ink); }

/* 時間軸：依期限排的各組 Timeline of groups (the content is a real time sequence) */
.timeline { position: relative; margin: 0 0 0 .55em; padding-left: 1.5em; border-left: 2px dotted var(--line-strong); }
.group { position: relative; padding-bottom: 1.3em; }
.group::before {
  content: ""; position: absolute; left: calc(-1.5em - 9px); top: .95em;
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--paper); border: 3px solid var(--hinoki);
}
.group.all-done::before { background: var(--accent); border-color: var(--accent); }
.group-head {
  display: flex; align-items: center; justify-content: space-between; gap: .6em; width: 100%;
  background: none; border: 0; padding: .5em 0; font: inherit; color: var(--ink); text-align: left; cursor: pointer;
  min-height: 2.9em;
}
.group-title { font-family: var(--serif); font-size: 1.2em; font-weight: 700; letter-spacing: .04em; }
.group-sub { color: var(--ink-2); font-size: .9em; font-weight: 400; display: block; }
.group-count { color: var(--ink-2); font-size: .9em; white-space: nowrap; }
.chev { display: inline-block; line-height: 1; transition: transform .15s; } /* v3.8：轉 90 度時不撐寬 no widening when rotated */
.group-head[aria-expanded="true"] .chev { transform: rotate(90deg); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
.row { display: flex; align-items: stretch; }
.row + .row { border-top: 1px solid var(--line); }
.row .check { flex: none; display: grid; place-items: center; width: 3.3em; cursor: pointer; }
.row .check input { width: 1.55em; height: 1.55em; margin: 0; accent-color: var(--accent); cursor: pointer; }
.row .body {
  flex: 1; display: flex; align-items: center; gap: .5em;
  padding: .7em .9em .7em .1em; color: var(--ink); text-decoration: none; min-height: 3.6em;
}

.tools { margin-top: 1.6em; }

.phones summary { cursor: pointer; font-weight: 700; padding: .6em 0; min-height: 2.9em; display: flex; align-items: center; }
.phones ul { list-style: none; margin: 0; padding: 0 0 .6em; }
.phones li { border-top: 1px solid var(--line); }
.tel-row { display: block; padding: .6em 0; color: var(--ink); text-decoration: none; min-height: 3em; }
.tel-row .tel { display: block; color: var(--accent); font-weight: 700; font-size: 1.05em; text-decoration: underline; text-underline-offset: .2em; }

.foot p { margin: .4em 0; }
.foot .disclaim { color: var(--ink); }
/* 回報錯誤連結 Feedback link */
.feedback { margin-top: .6em; }
.feedback .btn-text { padding-left: 0; }
.feedback p { margin: 0; }

/* ===== 詳細頁（Item detail） ===== */
.due-pill {

}
.due-pill.late { border-color: var(--late); background: var(--late-bg); color: var(--late); }
.late-msg { color: var(--late); font-weight: 700; }

.detail ul { padding-left: 1.3em; margin: .4em 0; }
.detail li { margin: .3em 0; }
.detail .law { color: var(--ink-2); }
.sources { list-style: none; padding-left: 0 !important; }
.sources li { margin: .5em 0; }
.sources .date { display: block; color: var(--ink-2); font-size: .88em; }
.detail-actions { margin-top: 2em; display: grid; gap: .7em; }
.top-back { margin-bottom: .3em; }

/* ===== 詳細頁新版（v3.8） New detail layout ===== */
.detail.brief { padding-top: .5em; padding-bottom: calc(6.5em + env(safe-area-inset-bottom)); }
.detail.brief .top-back { margin: 0; }
.detail.brief h1 { margin-bottom: .3em; }
.due-line { display: flex; flex-wrap: wrap; align-items: center; gap: .2em .7em; margin: 0 0 .6em; }
.due-line .due-pill { margin: 0; }
.days-left { font-weight: 700; color: var(--ink); }
.how {
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
  padding: .4em 1em .7em; margin: .7em 0 1em;
}
.how h2, .watch h2 { margin: .45em 0 .3em; font-size: 1.1em; }
.steps { list-style: none; counter-reset: step; margin: 0; padding: 0 !important; }
.steps > li { counter-increment: step; position: relative; padding-left: 2.4em; margin: .55em 0 .7em !important; }
.steps > li::before {
  content: counter(step); position: absolute; left: 0; top: .1em;
  width: 1.7em; height: 1.7em; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: .95em; line-height: 1;
}
.step-h { font-weight: 700; margin: 0 0 .15em; }
.step-p { margin: .2em 0 0; color: var(--ink-2); font-size: .95em; }
.steps ul { list-style: disc; margin: .2em 0 0 !important; padding-left: 1.15em !important; }
.steps ul li { margin: .15em 0 !important; }
.step-more { margin-top: .45em; padding-top: .35em; border-top: 1px dashed var(--line); }
.step-more-h { margin: 0; font-size: .95em; color: var(--ink-2); font-weight: 700; }

.steps .step-tel ul { list-style: none; padding-left: 0 !important; }
.steps .step-tel li { margin: 0 !important; }
.step-tel .tel-row { padding: .35em 0; min-height: 2.75em; }
.start-note { margin: -.25em 0 .7em; color: var(--ink-2); font-size: .92em; }
.late-msg + .start-note, p + .start-note { margin-top: 0; }
.why-line { margin: 0 0 1em; }
.why-line b { color: var(--accent); margin-right: .2em; }
.watch {
  background: var(--caution-bg); color: var(--caution-ink);
  border: 1px solid var(--caution-line); border-left-width: .35em; border-radius: 14px;
  padding: .3em 1em .5em; margin: 0 0 1em;
}
.watch h2 { color: var(--caution-ink); }
.watch ul { margin: .2em 0 .2em !important; padding-left: 1.15em !important; }
.watch li { margin: .35em 0 !important; }
details.more {
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
  padding: 0 1em; margin: 0 0 1em;
}
details.more > summary {
  cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; gap: .6em;
  min-height: 3.2em; padding: .55em 0; font-weight: 700;
}
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary .more-hint { display: block; font-weight: 400; font-size: .88em; color: var(--ink-2); }
details.more > summary .plus { flex: none; font-size: 1.3em; color: var(--accent); }
details.more[open] > summary .plus { transform: rotate(45deg); }
.more-sec { border-top: 1px solid var(--line); padding: .3em 0 .5em; }
.more-sec h3 { font-family: var(--serif); font-size: 1.04em; margin: .5em 0 .2em; }
.more-sec .phones-in ul { list-style: none; padding-left: 0 !important; }
.brief-foot { margin: .4em 0 0; }
.brief-foot a { color: var(--accent); }
.done-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;

  box-shadow: 0 -8px 18px -14px rgba(70, 66, 40, .5);
  padding: .55em 16px calc(.55em + env(safe-area-inset-bottom));
}
.done-bar .in { max-width: 38em; margin: 0 auto; }
/* 打勾列和上方列一樣，不跟著工具的「字放大」變大，字特大時才不會佔掉太多畫面（手機系統的大字還是會跟著）
   Like the top bar, the done bar ignores the in-app text size so it never covers too much of the screen */
.done-bar { font-size: 1.125rem; }
.done-bar .btn { white-space: nowrap; }
/* 用鍵盤或讀螢幕軟體移動時，焦點不要停在打勾列後面 Keep keyboard focus from hiding behind the done bar */
html:has(.done-bar) { scroll-padding-bottom: calc(7em + env(safe-area-inset-bottom)); }

html[data-scale="1.2"] .steps > li, html[data-scale="1.4"] .steps > li { padding-left: 2em; }

.next-card {

.next-card .next-due.late { color: var(--late); font-weight: 700; }

.modal-bg {

}

html[data-scale="1.2"] .store-pick, html[data-scale="1.4"] .store-pick { grid-template-columns: 1fr; }

  background: var(--paper); border: 1px solid var(--line); border-radius: .6em; padding: .6em;

/* ===== 錯誤訊息列（Error bar） ===== */
.error-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--late-bg); color: var(--late); border-top: 2px solid var(--late);

.error-bar .in { max-width: 38em; margin: 0 auto; }

#printArea { display: none; }
@media print {
  @page { margin: 14mm 12mm; }
  body { background: #fff; color: #000; font-size: 11.5pt; line-height: 1.6; }

  #printArea ul { margin: 2pt 0 0 18pt; padding: 0; }

  #printArea a { color: #000; text-decoration: none; }
}

   Compact list layout for large text or narrow screens so the text column stays wide */
html[data-scale="1.2"] .timeline, html[data-scale="1.4"] .timeline { margin-left: 0; padding-left: 0; border-left: 0; }

<script>
'use strict';
(function () {
  const C = window.CONTENT;
  const STORE_KEY = 'shenhoushi-daohang-v1';
  // 被放在別的網頁框架裡（例如 claude.ai 試用連結）時，瀏覽器不讓網頁開列印視窗，就不顯示列印按鈕
  // Inside a sandboxed frame (e.g. a claude.ai artifact) printing is blocked, so hide the print button
  const CAN_PRINT = (() => { try { return typeof window.print === 'function' && window.self === window.top; } catch (e) { return false; } })();
  const SCALES = [1, 1.2, 1.4];
  const STORES = ['711', 'fami']; // 超商代號 Store ids
  const STORE_VERIFIED = '2026-10-11'; // 超商列印說明查證日期 Date the store instructions were checked
  const errors = [];

  // ===== 日期工具 Date utilities（只用年月日，避免時區問題 date-only, timezone-safe） =====
  const D = {
    toUTC: (o) => Date.UTC(o.y, o.m - 1, o.d),
    fromUTC: (t) => { const x = new Date(t); return { y: x.getUTCFullYear(), m: x.getUTCMonth() + 1, d: x.getUTCDate() }; },
    addDays: (o, n) => D.fromUTC(D.toUTC(o) + n * 86400000),
    lastDay: (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate(),
    norm: (y, m) => [y + Math.floor((m - 1) / 12), ((m - 1) % 12 + 12) % 12 + 1],
    cmp: (a, b) => D.toUTC(a) - D.toUTC(b),
    diff: (a, b) => Math.round((D.toUTC(b) - D.toUTC(a)) / 86400000),
    today: () => { const n = new Date(); return { y: n.getFullYear(), m: n.getMonth() + 1, d: n.getDate() }; },
    valid: (o) => !!o && [o.y, o.m, o.d].every(Number.isInteger) && o.m >= 1 && o.m <= 12 && o.d >= 1 && o.d <= D.lastDay(o.y, o.m),
    // 以「月」定的期間：民法第 120、121 條／行政程序法第 48 條
    // 始日不算入（從過世隔天起算）；不是從月初起算時，到最後一個月「相當日的前一天」；
    // 最後一個月沒有相當日，用那個月的最後一天。不含假日順延（估算偏早、比較保險）。
    // Month periods per Civil Code arts. 120-121 / Administrative Procedure Act art. 48 (no holiday extension).
    addMonthsLegal: (death, months) => {
      const s = D.addDays(death, 1);
      if (s.d === 1) { const [y, m] = D.norm(s.y, s.m + months - 1); return { y, m, d: D.lastDay(y, m) }; }
      const [y, m] = D.norm(s.y, s.m + months);
      const last = D.lastDay(y, m);
      if (s.d > last) return { y, m, d: last };
      return D.addDays({ y, m, d: s.d }, -1);
    },
    // 以「日」定的期間：隔天算第 1 天，所以第 N 天＝過世日＋N 天
    addDaysLegal: (death, days) => D.addDays(death, days),
    week: (o) => '日一二三四五六'[new Date(D.toUTC(o)).getUTCDay()],
    fmt: (o) => `${o.y}年${o.m}月${o.d}日 星期${D.week(o)}`,
    fmtPlain: (o) => `${o.y}年${o.m}月${o.d}日`,
    fmtShort: (o) => `${o.y}/${o.m}/${o.d}`
  };

  // ===== 狀態與儲存 State & storage（全部包 try/catch：無痕模式也不會壞） =====
  let state = { answers: {}, done: {}, scale: 1 };
  let storageOK = true;
  const groupOpen = {}; // 這次使用中各組打開或收起（不存起來） Session-only group open state
  let returnToRow = null; // 回到清單時要捲到哪一項 Row to scroll to when returning to the list
  let lastRoute = '';
  let viaCard = null; // 從「現在先做這一件」打開的項目 Item opened from the "do this first" card

  function probeStorage() {
    try { const k = '__probe__'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; } catch (e) { return false; }
  }
  function sanitize(raw) {
    const out = { answers: {}, done: {}, scale: 1 };
    if (!raw || typeof raw !== 'object') return out;
    const a = raw.answers && typeof raw.answers === 'object' ? raw.answers : {};
    for (const q of C.QUESTIONS) {
      const v = a[q.id];
      if (q.type === 'date') {
        if (v && D.valid(v)) out.answers.date = { y: v.y, m: v.m, d: v.d };
      } else if (q.type === 'single') {
        if (q.options.some(([k]) => k === v)) out.answers[q.id] = v;
      } else if (q.type === 'multi') {
        if (Array.isArray(v)) {
          const ok = v.filter((x) => q.options.some(([k]) => k === x));
          let uniq = Array.from(new Set(ok));
          if (uniq.includes('none') && uniq.length > 1) uniq = uniq.filter((x) => x !== 'none');
          if (uniq.length) out.answers[q.id] = uniq;
        }
      }
    }
    const ids = new Set(C.ITEMS.map((i) => i.id));
    if (raw.done && typeof raw.done === 'object') {
      for (const [k, v] of Object.entries(raw.done)) if (ids.has(k) && v === true) out.done[k] = true;
    }
    if (SCALES.includes(raw.scale)) out.scale = raw.scale;
    if (raw.pdfSaved === true) out.pdfSaved = true; // 存過 PDF，清單上顯示「再看超商列印步驟」
    if (STORES.includes(raw.store)) out.store = raw.store; // 上次選的超商 Last store picked
    return out;
  }
  function load() {
    storageOK = probeStorage();
    if (!storageOK) return;
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) state = sanitize(JSON.parse(raw));
    } catch (e) {
      // 資料壞掉就重新開始 Corrupted data: start fresh
      state = { answers: {}, done: {}, scale: 1 };
      logError('讀取儲存資料失敗：' + e.message, false);
    }
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); storageOK = true; } catch (e) { storageOK = false; }
  }

  // ===== 小工具 Helpers =====
  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    if (props) {
      for (const [k, v] of Object.entries(props)) {
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? '' : String(v));
      }
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid == null || kid === false) continue;
      el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }
  const val = (x, c) => (typeof x === 'function' ? x(c) : x);
  // 日期、星期包成不換行的一段（兩段之間還是可以換行，字大時才不會超出畫面）
  // Wrap dates and weekdays in no-wrap spans (a break between them is still allowed so large text never overflows)
  // v3.8：「年」和「月日」分成兩段（字很大時可以在年和月之間換行）v3.8: year and month-day are separate parts
  const DATE_PARTS = /(\d{4}年|\d{1,2}月\d{1,2}日|星期[日一二三四五六])/;
  const noBreakDates = (text) => String(text).split(DATE_PARTS).map((p, i) => (i % 2 ? h('span', { class: 'nw' }, p) : p));
  const clean = (arr) => (arr || []).filter((x) => x != null && x !== '');

  // 情境：給內容表用的判斷函式 Context passed to CONTENT functions
  function makeCtx(a) {
    const ctx = {
      a,
      deathYear: a.date ? a.date.y : null,
      has: (k, v) => Array.isArray(a[k]) && a[k].includes(v),
      isUnsure: (k) => (Array.isArray(a[k]) ? a[k].includes('unsure') : a[k] === 'unsure'),
      hasOrUnsure: (k, v) => ctx.has(k, v) || ctx.isUnsure(k),
      // 只因為選了「不確定」才出現（沒有明確選這一項） Shown only because of "unsure"
      unsureOnly: (k, v) => ctx.isUnsure(k) && !ctx.has(k, v),
      // 今天是不是已經超過過世後 n 個月 Whether today is past n months after death
      pastMonths: (n) => !!a.date && D.cmp(D.today(), D.addMonthsLegal(a.date, n)) > 0,
      // v3.8.1：過世超過 n 天（和死亡登記 30 天的算法一樣）More than n days since the death (same rule as death registration)
      pastDays: (n) => !!a.date && D.cmp(D.today(), D.addDaysLegal(a.date, n)) > 0,
      debtRisk: a.debt === 'maybe' || a.debt === 'unsure',
      // 第 2 題選「不是因病」或「不確定」：可能是車禍或犯罪 Possibly an accident or a crime
      notDisease: a.cause === 'notdisease' || a.cause === 'unsure',
      // 有（或不確定有沒有）勞保、國保、農保：喪葬費收據要用來申請喪葬給付 Labor/NP/farmer funeral benefits possible
      insFuneral: ['labor', 'np', 'farmer'].some((k) => Array.isArray(a.ins) && (a.ins.includes(k) || a.ins.includes('unsure'))),
      shows: (id) => { const it = C.ITEMS.find((i) => i.id === id); return !!it && !!it.show(ctx); },
      // 清單裡有幾項手續的文件列了死亡證明（參考份數） How many visible procedures list a death certificate
      certCount: () => C.ITEMS.filter((it) => it.id !== 'death-cert' && it.show(ctx) && typeof it.bring === 'function')
        .filter((it) => clean(it.bring(ctx)).some((b) => /死亡證明|相驗屍體證明書|死亡診斷書/.test(b) && !/可以不附/.test(b))).length
    };
    return ctx;
  }

  function visibleQuestions(a) { return C.QUESTIONS.filter((q) => !q.showIf || q.showIf(a)); }
  function isAnswered(q, a) {
    const v = a[q.id];
    if (q.type === 'date') return D.valid(v) && D.cmp(v, D.today()) <= 0;
    if (q.type === 'multi') return Array.isArray(v) && v.length > 0;
    return v != null;
  }
  function answersComplete(a) { return visibleQuestions(a).every((q) => isAnswered(q, a)); }

  // ===== 期限計算 Deadlines =====
  function computeDue(item, ctx) {
    const dl = val(item.deadline, ctx);
    const death = ctx.a.date;
    let date = null;
    if (dl.type === 'days') date = D.addDaysLegal(death, dl.n);
    else if (dl.type === 'months') date = D.addMonthsLegal(death, dl.n);
    else if (dl.type === 'suggest') date = D.addMonthsLegal(death, dl.months);
    const out = { dl, date, late: false, left: null, suggest: dl.type === 'suggest' };
    if (date) {
      out.left = D.diff(D.today(), date);
      out.late = out.left < 0;
    }
    return out;
  }
  function dueLine(due, forExport) {
    const { dl, date } = due;
    if (!date) return { text: dl.text, late: false };
    if (due.late) {
      if (due.suggest) return { text: `建議日期 ${D.fmtPlain(date)} 已過，現在還是可以申請`, late: false };
      // 匯出時接一句「現在怎麼辦」，不然家人只看到「已超過期限」可能就放棄了
      // In exports add what to do now, so family members don't give up on seeing "overdue"
      const what = forExport ? `：${dl.lateShort || '請盡快問辦理單位怎麼補辦'}` : '';
      return { text: `已超過期限（估算 ${D.fmtPlain(date)}）${what}`, late: true };
    }
    const label = due.suggest ? '建議日期' : '截止';
    let tail = '';
    // 列印、PDF、分享的文字不寫「還有幾天」，因為可能幾天後才看到 Exports omit "days left"
    if (!forExport) {
      if (due.left === 0) tail = due.suggest ? '，就是今天' : '，今天是最後一天';
      else if (due.left <= 60) tail = `，還有 ${due.left} 天`;
    }
    return { text: `${label} ${D.fmt(date)}（估算${tail}）`, late: false };
  }
  function tagText(r) {
    return (r.important ? '（重要）' : '') + (r.confirm ? (r.it.confirmTagExport || '（可能不適用，需要再確認）') : '');
  }

  // 依答案整理出要顯示的項目 Build the visible list
  function buildList(a) {
    const ctx = makeCtx(a);
    const items = C.ITEMS.filter((it) => it.show(ctx)).map((it, idx) => ({
      it, idx, due: computeDue(it, ctx),
      title: val(it.title, ctx),
      important: it.important ? it.important(ctx) : false,
      confirm: it.confirm ? it.confirm(ctx) : false
    }));
    const groups = C.GROUPS.map((g) => {
      const rows = items.filter((x) => x.it.group === g.id).sort((p, q) => {
        const pd = p.due.date ? D.toUTC(p.due.date) : Infinity;
        const qd = q.due.date ? D.toUTC(q.due.date) : Infinity;
        return pd - qd || p.idx - q.idx;
      });
      return { g, rows };
    }).filter((x) => x.rows.length);
    const donts = C.DONTS.filter((d) => d.show(ctx));
    return { ctx, items, groups, donts };
  }

  // ===== 錯誤處理 Error handling =====
  function logError(msg, show = true) {
    errors.push(`${new Date().toISOString()}｜${location.hash || '#/'}｜${msg}`);
    if (errors.length > 20) errors.shift();
    if (show) showErrorBar();
  }
  // ===== 回報錯誤 Feedback link =====
  // 只把「哪一頁或哪一項」和版本帶到 Google 表單，不帶使用者的回答、日期或打勾紀錄。
  // Only the page/item name and version go to the form — never answers, dates or ticks.
  // 全部包在 try 裡：內容表壞掉（C 不存在）時，錯誤列還是要能出現
  // Everything inside try: the error bar must still work if CONTENT failed to load
  function feedbackHref(where) {
    try {
      const f = (C && C.FEEDBACK) || {};
      if (!f.url) return null;
      const u = new URL(f.url);
      // 只接受 Google 表單的填寫網址（不接受短網址、編輯網址） Only the long Google Forms viewform URL
      if (u.protocol !== 'https:' || u.hostname !== 'docs.google.com' || !/^\/forms\/.+\/viewform$/.test(u.pathname)) return null;
      // 先清掉網址裡原本的預先填入值（例如設定時填的「測試項目」） Drop pre-fill values already in the URL
      [...u.searchParams.keys()].filter((k) => k === 'usp' || /^entry\./.test(k)).forEach((k) => u.searchParams.delete(k));
      const pre = [[f.whereEntry, where], [f.versionEntry, C.APP_VERSION]].filter(([k, v]) => /^entry\.\d+$/.test(k || '') && v);
      if (pre.length) { u.searchParams.set('usp', 'pp_url'); pre.forEach(([k, v]) => u.searchParams.set(k, v)); }
      return u.href;
    } catch (e) { return null; }
  }
  // 回報用的項目名稱：固定不變，不跟著回答變（標題會隨回答改變的項目，用 feedbackName）
  // Fixed item name for feedback, never derived from answers (items with answer-dependent titles use feedbackName)
  function feedbackName(it) {
    return it.feedbackName || (typeof it.title === 'string' ? it.title : it.id);
  }
  function feedbackNode(where) {
    const href = feedbackHref(where);
    if (!href) return null;
    // 有沒有真的幫忙填好「哪一頁」，說明文字跟著變 Wording depends on whether the page name is pre-filled
    let filled = false;
    try { const k = C.FEEDBACK.whereEntry; filled = /^entry\.\d+$/.test(k || '') && new URL(href).searchParams.has(k); } catch (e) { filled = false; }
    return h('div', { class: 'feedback' },
      h('a', { class: 'btn-text', href, target: '_blank', rel: 'noopener noreferrer' }, '回報錯誤或過時的資料'),
      h('p', { class: 'small muted' }, filled
        ? '會打開 Google 表單（另一個網站），已經先幫您填好是哪一頁，只要寫哪裡不對就好。您在這個工具裡的回答不會送出去。'
        : '會打開 Google 表單（另一個網站），請寫是哪一頁、哪裡不對。您在這個工具裡的回答不會送出去。'));
  }

  // ===== 字放大 Font size =====
  function applyScale() {
    document.documentElement.style.setProperty('--scale', String(state.scale));
    const btn = document.getElementById('fontBtn');
    const label = { 1: '標準', 1.2: '大', 1.4: '特大' }[state.scale];

  // ===== 路由 Routing（用網址的 # 部分，讓手機的「返回」也能用） =====
  function go(hash, replace) {
    if (replace) location.replace(hash); else location.hash = hash;
  }
  function route() {
    try {
      closeModal();
      const hash = location.hash || '';
      const parts = hash.replace(/^#\/?/, '').split('/').filter(Boolean);
      const a = state.answers;
      if (parts.length === 0) {
        if (answersComplete(a)) return go('#/list', true);
        return render(viewWelcome());
      }
      if (parts[0] !== 'list' && parts[0] !== 'item') lastRoute = parts.join('/');
      if (parts[0] === 'start') return render(viewWelcome(true));
      if (parts[0] === 'q') {
        const q = visibleQuestions(a).find((x) => x.id === parts[1]);
        if (!q) return go('#/q/date', true);
        return render(viewQuestion(q));
      }
      if (parts[0] === 'list') {
        if (!answersComplete(a)) return go(firstUnanswered(), true);
        // 從某一項回到清單時，捲回那一項 Coming back from an item: scroll to that row
        const fromItem = lastRoute.startsWith('item/') ? lastRoute.slice(5) : null;
        // 從「現在先做這一件」打開的，回來時停在最上面，看下一件 Opened from the card: come back to the top to see the next one
        const backToCard = viaCard !== null && (fromItem === viaCard || returnToRow === viaCard);
        const target = backToCard ? null : (returnToRow || fromItem);
        returnToRow = null; viaCard = null; lastRoute = 'list';
        if (target) { const it = C.ITEMS.find((x) => x.id === target); if (it) groupOpen[it.group] = true; }
        render(viewList(), false, target);
        return;
      }
      if (parts[0] === 'item') {
        if (!answersComplete(a)) return go(firstUnanswered(), true);
        const built = buildList(a);
        const row = built.items.find((x) => x.it.id === parts[1]);
        if (!row) return go('#/list', true);
        lastRoute = 'item/' + parts[1];
        return render(viewItem(row, built));
      }
      go('#/', true);
    } catch (e) {
      logError('畫面產生失敗：' + e.message);
    }
  }
  function firstUnanswered() {
    const q = visibleQuestions(state.answers).find((x) => !isAnswered(x, state.answers));
    return '#/q/' + (q ? q.id : 'date');
  }
  function render(node, keepPlace, scrollToRow) {
    const main = document.getElementById('main');
    const y = window.scrollY;
    main.replaceChildren(node);
    if (keepPlace) { window.scrollTo(0, y); return; }
    if (scrollToRow) {
      const link = main.querySelector(`a[href="#/item/${scrollToRow}"]`);
      if (link) { link.scrollIntoView({ block: 'center' }); link.focus({ preventScroll: true }); return; }
    }
    window.scrollTo(0, 0);
    // 換頁後把焦點移到標題，讀螢幕軟體才會從頭念 Move focus to the heading for screen readers
    const h1 = main.querySelector('h1');
    if (h1) { h1.setAttribute('tabindex', '-1'); h1.focus({ preventScroll: true }); }
  }

  // ===== 畫面 1：開始頁 Welcome =====
  // 開始頁的茶杯插圖（固定的線條圖，不含任何使用者資料） Static teacup drawing for the welcome page
  const TEACUP_SVG = '<svg class="hero-art" viewBox="0 0 120 92" aria-hidden="true" focusable="false">'
    + '<path d="M50 34c-5-6 5-9 0-16M62 34c-5-6 5-9 0-16M74 34c-5-6 5-9 0-16" fill="none" stroke="var(--hinoki)" stroke-width="2.4" stroke-linecap="round"/>'
    + '<path d="M33 42h54l-5 28c-1 6-5 9-11 9H49c-6 0-10-3-11-9z" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/>'
    + '<path d="M38 52c14 3 30 3 45 0" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>'

        : h('a', { class: 'btn btn-primary', href: '#/q/date' }, '開始'),
      h('div', { class: 'note-box stack' },
        h('p', { style: 'margin:0' }, '僅供參考，以官方公告為準；不是法律意見。有問題請自行詢問律師、地政士（代書）或辦理單位。'),

      h('p', { class: 'small muted' }, `這是個人製作的參考工具，不是政府網站。內容查證日期：${C.VERIFIED_ON}。`),

    );
