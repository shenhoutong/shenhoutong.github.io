  // ===== 畫面 2：問題 Question =====
  function viewQuestion(q) {
    const a = state.answers;
    const qs = visibleQuestions(a);
    const idx = qs.findIndex((x) => x.id === q.id);
    const total = qs.length;
    const prevHash = idx > 0 ? '#/q/' + qs[idx - 1].id : '#/start';
    const errBox = h('p', { class: 'error', role: 'alert', hidden: true });
    const showErr = (msg) => { errBox.textContent = msg; errBox.hidden = false; };
    const canJump = answersComplete(a);

    function next() {
      const now = visibleQuestions(state.answers);
      const i = now.findIndex((x) => x.id === q.id);
      const nq = now[i + 1];
      if (nq) go('#/q/' + nq.id);
      else go('#/list');
    }

    const titleId = 'q-title';
    let body;
    if (q.type === 'date') body = dateField(q, showErr, errBox, next);
    else body = optionList(q, titleId, showErr, next);

    return h('div', { class: 'wrap' },
      h('p', { class: 'progress-text' }, `第 ${idx + 1} 題，共 ${total} 題`),
      h('div', { class: 'progress', 'aria-hidden': 'true' }, h('span', { style: `width:${Math.round(((idx + 1) / total) * 100)}%` })),
      h('h1', { id: titleId }, q.title),
      q.hint ? h('p', { class: 'q-hint' }, q.hint) : null,
      body,
      errBox,
      h('div', { class: 'back-row' },
        h('a', { class: 'btn-text', href: prevHash }, '‹ 上一步'),
        canJump ? h('a', { class: 'btn-text', href: '#/list' }, '改好了，看清單') : null)
    );
  }

  function optionList(q, titleId, showErr, next) {
    const multi = q.type === 'multi';
    // 「都沒有」不能和其他選項一起選；「不確定」可以和知道的選項一起選
    // "None" is exclusive; "Unsure" can be combined with known options
    const exclusive = ['none'];
    const wrap = h('div', { class: 'opts', role: multi ? 'group' : 'radiogroup', 'aria-labelledby': titleId });
    const current = () => state.answers[q.id];
    const isOn = (k) => (multi ? (current() || []).includes(k) : current() === k);

    const buttons = q.options.map(([k, label]) => {
      const b = h('button', {
        type: 'button', class: 'opt' + (multi ? ' multi' : ''),
        role: multi ? 'checkbox' : 'radio', 'aria-checked': String(isOn(k)), 'data-value': k
      }, h('span', { class: 'mark', 'aria-hidden': 'true' }), h('span', null, label));
      b.addEventListener('click', () => {
        if (multi) {
          let cur = (current() || []).slice();
          if (cur.includes(k)) cur = cur.filter((x) => x !== k);
          else if (exclusive.includes(k)) cur = [k];
          else cur = cur.filter((x) => !exclusive.includes(x)).concat(k);
          if (cur.length) state.answers[q.id] = cur; else delete state.answers[q.id];
          save();
          buttons.forEach((bb) => bb.setAttribute('aria-checked', String(isOn(bb.dataset.value))));
        } else {
          state.answers[q.id] = k;
          save();
          buttons.forEach((bb) => bb.setAttribute('aria-checked', String(bb.dataset.value === k)));
          // 單選：選了就自動到下一題（短暫停留讓人看到選了什麼）Auto-advance after a short pause
          setTimeout(next, 260);
        }
      });
      return b;
    });
    if (q.groups) {
      // v3.8.1：選項分組（第 6 題）。每一組有小標題，最後一組（都沒有、不確定）用一條線隔開
      // v3.8.1: option groups (Q6). Each group has a small heading; the last group (none / unsure) is set apart by a line
      const byKey = Object.fromEntries(buttons.map((b) => [b.dataset.value, b]));
      q.groups.forEach((g, gi) => {
        const gid = `${q.id}-group-${gi}`;
        wrap.append(h('div', { class: 'opt-group' + (g.title ? '' : ' opt-group-plain'), role: g.title ? 'group' : null, 'aria-labelledby': g.title ? gid : null },
          g.title ? h('p', { class: 'opt-group-title', id: gid }, g.title) : null,
          g.note ? h('p', { class: 'opt-group-note' }, g.note) : null,
          g.keys.map((k) => byKey[k])));
      });
    } else wrap.append(...buttons);
    if (!multi) {
      // 回到已經答過的題目時，給一個「下一步」，不用重選 Revisit: allow moving on without re-selecting
      if (current() == null) return wrap;
      return h('div', null, wrap, h('div', { class: 'q-actions' },
        h('button', { type: 'button', class: 'btn btn-primary', onclick: next }, '下一步')));
    }
    return h('div', null, wrap,
      h('div', { class: 'q-actions' },
        h('button', { type: 'button', class: 'btn btn-primary', onclick: () => {
          if (!(current() || []).length) return showErr('請至少選一個。不知道的話，可以選「不確定」。');
          next();
        } }, '下一步')));
  }

  function dateField(q, showErr, errBox, next) {
    const t = D.today();
    const cur = state.answers.date || {};
    const mk = (id, label, opts, sel) => {
      const s = h('select', { id, name: id },
        h('option', { value: '' }, '請選擇'),
        opts.map(([v, txt]) => h('option', { value: String(v), selected: String(v) === String(sel) ? true : null }, txt)));
      return [h('div', { class: 'field' }, h('label', { for: id }, label), s), s];
    };
    const years = []; for (let y = t.y; y >= t.y - 20; y--) years.push([y, `${y}年（民國${y - 1911}年）`]);
    const months = []; for (let m = 1; m <= 12; m++) months.push([m, `${m} 月`]);
    const [fy, sy] = mk('sel-y', '年', years, cur.y || t.y);
    const [fm, sm] = mk('sel-m', '月', months, cur.m);
    const [fd, sd] = mk('sel-d', '日', [], null);

    function fillDays() {
      const y = +sy.value || t.y, m = +sm.value || 1;
      const keep = sd.value || (cur.d ? String(cur.d) : '');
      const last = D.lastDay(y, m);
      sd.replaceChildren(h('option', { value: '' }, '請選擇'));
      for (let d = 1; d <= last; d++) sd.append(h('option', { value: String(d) }, `${d} 日`));
      if (keep && +keep <= last) sd.value = keep;
    }
    fillDays();
    sy.addEventListener('change', () => { errBox.hidden = true; fillDays(); });
    sm.addEventListener('change', () => { errBox.hidden = true; fillDays(); });
    sd.addEventListener('change', () => { errBox.hidden = true; });

    return h('div', null,
      h('div', { class: 'date-grid', role: 'group', 'aria-label': '過世日期' }, fy, fm, fd),
      h('div', { class: 'q-actions' },
        h('button', { type: 'button', class: 'btn btn-primary', onclick: () => {
          const o = { y: +sy.value, m: +sm.value, d: +sd.value };
          if (!sy.value || !sm.value || !sd.value) return showErr('請選好年、月、日。');
          if (!D.valid(o)) return showErr('這個日期不存在，請再確認一次。');
          if (D.cmp(o, D.today()) > 0) return showErr('日期好像填錯了：這一天還沒到。請再確認一次。');
          state.answers.date = o;
          save();
          next();
        } }, '下一步')));
  }

  // ===== 畫面 3：待辦清單 List =====
  // 「現在先做這一件」：先選已經超過期限的；沒有的話，選 14 天內就到期的（最早到期的那一項）；都沒有的話，選清單上最前面、還沒打勾的。
  // "Do this one first": an overdue item first; otherwise the item due soonest within 14 days; otherwise the first unticked row.
  const NEXT_SOON_DAYS = 14;
  const CERT_FIRST_DAYS = 7; // v3.8.2：過世幾天內，卡片先放死亡證明書 days after the death when the card still shows the death certificate first
  // v3.8.2：截止日下面那一句一直放在上面的項目（所得稅的配偶例外，決定要不要自己報）Items whose note under the date always stays on top
  const START_ALWAYS = new Set(['income-tax']);
  // v3.8.2：第 6 題只因為選了「不確定」才出現的保險、年金項目（清單上收成一個框，先查有沒有）
  // v3.8.2: insurance/pension rows shown only because Q6 was "unsure" (grouped in one box on the list)
  const UNSURE_INS = { 'labor-self': 'labor', pension: 'pension', np: 'np', farmer: 'farmer', 'gov-pension': 'govpension', 'gov-mil': 'gov', 'commercial-ins': 'commercial' };
  function inUnsureBox(r, c) {
    const k = UNSURE_INS[r.it.id];
    // 農保那一項也可能因為第 8 題的老農津貼出現；那樣就不放進框裡 The farmer row may come from Q8 instead
    return !!k && c.unsureOnly('ins', k) && !(r.it.id === 'farmer' && c.has('flags', 'oldfarmer'));
  }
  function pickNext(built) {
    const all = built.groups.flatMap((x) => x.rows).filter((r) => !state.done[r.it.id]);
    if (!all.length) return null;
    // 框裡「還不確定有沒有」的保險和年金不當第一件 Rows in the unsure box are never picked first
    const rows = all.filter((r) => !inUnsureBox(r, built.ctx));
    if (!rows.length) return all[0];
    const late = rows.find((r) => r.due.late && !r.due.suggest);
    if (late) return late;
    const soon = rows.filter((r) => r.due.date && !r.due.late && r.due.left <= NEXT_SOON_DAYS);
    if (soon.length) return soon.reduce((a, b) => {
      // 法定期限比「建議」日期優先 Legal deadlines before suggested dates
      if (a.due.suggest !== b.due.suggest) return a.due.suggest ? b : a;
      return b.due.left < a.due.left ? b : a;
    });
    // v3.8.2：過世 7 天內先拿死亡證明書（辦死亡登記要用到）；之後跳過沒有期限的項目，選最早到期的（同一天的話，法定期限優先）
    // v3.8.2: the death certificate first in the first 7 days; after that skip undated rows and pick the earliest date
    const cert = rows.find((r) => r.it.id === 'death-cert');
    if (cert && !built.ctx.pastDays(CERT_FIRST_DAYS)) return cert;
    const dated = rows.filter((r) => r.due.date && !r.due.late);
    const sure = dated.filter((r) => !r.confirm);
    const pool = sure.length ? sure : dated;
    if (pool.length) return pool.reduce((a, b) => (b.due.left < a.due.left || (b.due.left === a.due.left && a.due.suggest && !b.due.suggest) ? b : a));
    return rows[0];
  }
  function nextCard(r) {
    if (!r) return null;
    const line = dueLine(r.due);
    return h('section', { class: 'next-card', 'aria-labelledby': 'next-h', 'data-next': r.it.id },
      h('h2', { id: 'next-h' }, '現在先做這一件'),
      h('p', { class: 'next-t' }, r.title,
        r.important ? h('span', { class: 'tag tag-imp' }, '重要') : null,
        r.confirm ? h('span', { class: 'tag tag-chk' }, r.it.confirmTag || '需要再確認') : null),
      h('p', { class: 'next-due' + (line.late ? ' late' : '') }, noBreakDates(line.text)),
      // 用按鈕不用連結：清單裡那一項的連結才是唯一的「#/item/…」連結 A button, so each item still has exactly one link on the list
      h('button', { type: 'button', class: 'btn btn-primary', 'aria-label': '看怎麼辦：' + r.title, onclick: () => { viaCard = r.it.id; go('#/item/' + r.it.id); } }, '看怎麼辦'));
  }

  function viewList() {
    const built = buildList(state.answers);
    const { groups, donts, items, ctx } = built;
    const total = items.length;
    const doneN = items.filter((x) => state.done[x.it.id]).length;

    // 只展開前兩組還沒做完的；使用者自己打開或收起的，照使用者的
    // Expand only the first two unfinished groups unless the user toggled a group this session
    let opened = 0;
    const groupNodes = groups.map(({ g, rows }) => {
      const doneInGroup = rows.filter((r) => state.done[r.it.id]).length;
      const allDone = doneInGroup === rows.length;
      // 有超過期限、還沒做的項目，那一組也打開 Also open groups that have overdue, unfinished items
      const hasLate = rows.some((r) => r.due.late && !r.due.suggest && !state.done[r.it.id]);
      const firstTwo = !allDone && opened < 2; if (firstTwo) opened++;
      const auto = firstTwo || hasLate;
      const open = g.id in groupOpen ? groupOpen[g.id] : auto;
      const panelId = 'panel-' + g.id;
      // v3.8.2：第 6 題選「不確定」才出現的保險和年金，2 項以上就收成一個框，放在這一組最後 Unsure-only insurance rows (2+) go into one box at the end
      const boxRows = rows.filter((r) => inUnsureBox(r, ctx));
      const inBox = boxRows.length >= 2;
      const panel = h('div', { class: 'panel', id: panelId, hidden: !open },
        (inBox ? rows.filter((r) => !boxRows.includes(r)) : rows).map((r) => rowNode(r)),
        inBox ? unsureBox(boxRows, built) : null);
      const head = h('button', { type: 'button', class: 'group-head', 'aria-expanded': String(open), 'aria-controls': panelId },
        h('span', null, h('span', { class: 'group-title' }, g.title), g.sub ? h('span', { class: 'group-sub' }, g.sub) : null),
        h('span', { class: 'group-count' }, `${rows.length} 件${doneInGroup ? `，完成 ${doneInGroup} 件` : ''} `, h('span', { class: 'chev', 'aria-hidden': 'true' }, '›')));
      head.addEventListener('click', () => {
        const isOpen = head.getAttribute('aria-expanded') === 'true';
        head.setAttribute('aria-expanded', String(!isOpen));
        panel.hidden = isOpen;
        groupOpen[g.id] = !isOpen;
      });
      return h('section', { class: 'group' + (allDone ? ' all-done' : ''), 'aria-label': g.title, 'data-group': g.id }, head, panel);
    });

    const deathTxt = D.fmtPlain(ctx.a.date);
    const next = pickNext(built);
    return h('div', { class: 'wrap' },
      h('h1', null, '您的待辦清單'),
      h('p', { class: 'summary muted' }, items.some((r) => r.due.late && !r.due.suggest && !state.done[r.it.id])
        ? `依過世日期 ${deathTxt} 估算。紅字的項目已經超過估算的期限，請先看紅字的項目，打電話問現在還能怎麼辦。不用一次辦完。`
        : next ? `依過世日期 ${deathTxt} 估算。不用一次辦完，先做下面這一件就好。`
          : `依過世日期 ${deathTxt} 估算。清單上的每一項都打勾了，辛苦您了。如果有還沒辦完的，可以點下面的分組打開，再取消打勾。`),
      nextCard(next),
      h('div', { class: 'done-count' },
        h('span', null, `已完成 ${doneN} 件，共 ${total} 件`),
        h('span', { class: 'bar', 'aria-hidden': 'true' }, h('span', { style: `width:${total ? Math.round(doneN / total * 100) : 0}%` }))),
      storageOK ? null : h('p', { class: 'storage-warn' }, '這支手機目前沒辦法保存您的回答和打勾紀錄（可能是用了無痕模式）。關掉網頁後，回答和打勾都會不見；需要的話，可以先存成 PDF 或傳給家人。'),
      dontsNode(donts),
      h('div', { class: 'timeline' }, groupNodes),
      h('div', { class: 'tools stack' },
        (() => { const b = h('button', { type: 'button', class: 'btn btn-secondary', id: 'pdfBtn' }, '存成 PDF，拿去超商印'); b.addEventListener('click', () => doPdf(built, b)); return b; })(),
        state.pdfSaved ? storeAgainBtn() : null,
        CAN_PRINT
          ? h('div', { class: 'btn-row' },
              h('button', { type: 'button', class: 'btn btn-secondary', onclick: () => doShare(built) }, '傳給家人'),
              h('button', { type: 'button', class: 'btn btn-secondary', onclick: () => doPrint(built) }, '用家裡的印表機印'))
          : h('button', { type: 'button', class: 'btn btn-secondary', onclick: () => doShare(built) }, '傳給家人'),
        h('a', { class: 'btn btn-secondary', href: '#/q/date' }, '修改回答')),
      phonesNode(built),
      h('div', { class: 'foot' },
        h('p', null, '日期是依過世日期估算的；最後一天如果剛好是假日，這裡沒有往後延。有些期限的起算點可能比較晚。請不要等到最後一天。'),
        h('p', { class: 'disclaim' }, '僅供參考，以官方公告為準；不是法律意見。有問題請自行詢問律師、地政士（代書）或辦理單位。'),
        h('p', null, `內容查證日期：${C.VERIFIED_ON}。這是個人製作的參考工具，不是政府網站。您的回答只存在這支手機裡。`),
        feedbackNode('待辦清單'),
        h('p', null, h('button', { type: 'button', class: 'btn-text', onclick: confirmClear }, '清除這支手機上的回答和打勾紀錄')))
    );
  }

  // v3.8.2：「還不確定有沒有的保險和年金」框（只寫已經查證過的辦理單位和電話）The "not sure yet" insurance box
  const UNSURE_INS_BLI = { 'labor-self': '勞保', pension: '勞工退休金', np: '國民年金', farmer: '農保' };
  function unsureBox(rows, built) {
    const ids = new Set(rows.map((r) => r.it.id));
    const doneN = rows.filter((r) => state.done[r.it.id]).length;
    const bli = Object.keys(UNSURE_INS_BLI).filter((id) => ids.has(id));
    const life = built.items.find((x) => x.it.id === 'life-ins');
    const how = [
      bli.length ? bli.map((id) => UNSURE_INS_BLI[id]).join('、') + '：都是勞保局辦的，打下面的勞保局電話問。' : null,
      ids.has('gov-mil') ? '公保：打下面的臺灣銀行公教保險部電話問；軍保：打電話問國防部。' : null,
      ids.has('gov-pension') ? '公務人員的月退休金：問過世者退休前服務的機關的人事單位。' : null,
      ids.has('commercial-ins') && life ? ['人壽保險等商業保險：先看「', h('a', { href: '#/item/life-ins' }, life.title), '」那一項。'] : null
    ].filter(Boolean);
    const keys = [bli.length ? 'bli' : null, ids.has('np') ? 'bliNp' : null, ids.has('farmer') ? 'bliFarm' : null, ids.has('gov-mil') ? 'bot' : null].filter(Boolean);
    // 預設收起來；有超過期限、還沒做的就打開；使用者自己打開或收起的，照使用者的 Closed by default unless something inside is overdue
    const hasLate = rows.some((r) => r.due.late && !r.due.suggest && !state.done[r.it.id]);
    const open = 'unsure-ins' in groupOpen ? groupOpen['unsure-ins'] : hasLate;
    const box = h('details', { class: 'unsure-box', open: open ? true : null },
      h('summary', null,
        h('span', { class: 'ub-txt' },
          h('span', { class: 'ub-t' }, '還不確定有沒有的保險和年金'),
          h('span', { class: 'ub-c' }, `${rows.length} 項${doneN ? `，完成 ${doneN} 項` : ''}；先打電話查有沒有，有的再辦`)),
        h('span', { class: 'chev', 'aria-hidden': 'true' }, '›')),
      h('div', { class: 'ub-body' },
        h('p', null, '這幾項要家人生前有那一種保險或年金，才需要辦。不知道有沒有的話，先問：'),
        h('ul', null, how.map((t) => h('li', null, t))),
        keys.length ? h('div', { class: 'ub-phones' }, phoneList(keys)) : null,
        h('p', { class: 'small muted' }, '查到有的，可以回去修改第 6 題，清單就只會留下有的；確定沒有的，直接打勾。'),
        h('div', { class: 'ub-rows' }, rows.map((r) => rowNode(r)))));
    box.addEventListener('toggle', () => { groupOpen['unsure-ins'] = box.open; });
    return box;
  }
  function rowNode(r) {
    const id = r.it.id;
    const done = !!state.done[id];
    const line = dueLine(r.due);
    const cbId = 'cb-' + id;
    const cb = h('input', { type: 'checkbox', id: cbId, checked: done ? true : null, 'aria-label': `${r.title}：做完了` });
    cb.addEventListener('change', () => {
      const top0 = cb.getBoundingClientRect().top; // 打勾前的位置 Position before re-rendering
      if (cb.checked) state.done[id] = true; else delete state.done[id];
      save();
      groupOpen[r.it.group] = true; // 打勾的那一組維持打開 Keep this group open
      if (cb.closest('.unsure-box')) groupOpen['unsure-ins'] = true; // v3.8.2：框也維持打開 keep the box open too
      // 重畫清單（不跳回最上面），更新計數 Re-render in place to update counts
      render(viewList(), true);
      const again = document.getElementById(cbId);
      // 上面的「現在先做這一件」換了或不見了，捲回原本的位置 Scroll back so the row stays where it was
      if (again) { window.scrollBy(0, again.getBoundingClientRect().top - top0); again.focus({ preventScroll: true }); }
    });
    return h('div', { class: 'row' + (done ? ' done' : '') },
      h('label', { class: 'check', for: cbId }, cb),
      h('a', { class: 'body', href: '#/item/' + id },
        h('span', { class: 'txt' },
          h('span', { class: 't' }, r.title,
            r.important ? h('span', { class: 'tag tag-imp' }, '重要') : null,
            r.confirm ? h('span', { class: 'tag tag-chk' }, r.it.confirmTag || '需要再確認') : null),
          h('span', { class: 'due' + (line.late ? ' late' : '') }, done ? '已完成' : noBreakDates(line.text))),
        h('span', { class: 'go', 'aria-hidden': 'true' }, '›')));
  }

  function dontsNode(donts) {
    if (!donts.length) return null;
    return h('section', { class: 'caution', 'aria-labelledby': 'dont-title' },
      h('h2', { id: 'dont-title' }, '先不要做'),
      donts.map((d) => h('details', null,
        h('summary', null, h('span', { class: 'dont-head' },
          h('span', { class: 'dont-title' }, d.title),
          h('span', { class: 'dont-why' }, '為什麼：' + d.why))),
        h('div', { class: 'detail-body' },
          d.body.map((p) => (typeof p === 'string' ? h('p', null, p) : h('ul', null, p.ul.map((li) => h('li', null, li))))),
          h('p', { class: 'small' }, '來源：', clean(d.src).map((k, i) => [i ? '、' : '', srcLink(k)]))))));
  }

  // 來源日期的顯示文字 How to show a source's date
  function srcDate(x) {
    if (x === '頁面無日期') return '頁面沒有標日期';
    if (x === '頁面無更新日期') return '頁面沒有標更新日期';
    if (/^\d{4}-\d{2}/.test(x) && !/查閱|整編|引用|公布|生效|版|修正|函|更新|發布/.test(x)) return '頁面日期：' + x;
    return x;
  }
  function srcLink(k) {
    const s = C.SRC[k];
    return h('a', { href: s[1], target: '_blank', rel: 'noopener noreferrer' }, s[0]);
  }

  function phoneList(keys) {
    return h('ul', null, keys.map((k) => {
      const p = C.PHONES[k];
      return h('li', null, h('a', { class: 'tel-row', href: 'tel:' + p.tel },
        h('span', { style: 'display:block' }, p.name),
        h('span', { class: 'tel' }, p.show)));
    }));
  }
  function printPhoneKeys(built) {
    const keys = new Set();
    built.items.forEach((r) => clean(val(r.it.phones, built.ctx)).forEach((k) => keys.add(k)));
    return Array.from(keys);
  }
  function phonesNode(built) {
    const keys = printPhoneKeys(built);
    if (!keys.length) return null;
    return h('details', { class: 'phones' },
      h('summary', null, '不清楚的話，可以打這些電話問'),
      phoneList(keys));
  }

  // ===== 畫面 4：一項的詳細說明 Item detail =====
  function viewItem(row, built) {
    const { it, due } = row;
    const ctx = built.ctx;
    const done = !!state.done[it.id];
    const dl = due.dl;

    const blocks = (arr) => clean(arr).map((x) => {
      if (typeof x === 'string') return h('p', null, x);
      const list = x.ol ? h('ol', null, clean(x.ol).map((li) => h('li', null, li))) : h('ul', null, clean(x.ul).map((li) => h('li', null, li)));
      return h('div', null, h('p', { style: 'font-weight:700;margin-bottom:0' }, x.h), list);
    });
    const section = (title, content) => (content && (!Array.isArray(content) || content.length) ? [h('h2', null, title), content] : null);

    // 期限 Deadline
    // 超過期限要用文字說，不能只靠紅色 Say "overdue" in words, not only by color
    let pill;
    if (due.date) {
      const text = due.late
        ? (due.suggest ? `建議日期已過（${D.fmt(due.date)}）` : `已超過期限（估算 ${D.fmt(due.date)}）`)
        : `${due.suggest ? '建議日期' : '截止'} ${D.fmt(due.date)}（估算）`;
      pill = h('p', { class: 'due-pill' + (due.late && !due.suggest ? ' late' : '') }, noBreakDates(text));
    } else {
      pill = h('p', { class: 'due-pill' }, dl.text);
    }
    const lateNow = due.late ? h('p', { class: due.suggest ? '' : 'late-msg' }, dl.late || C.LATE_GENERAL) : null;
    const deadlineBlock = [];
    if (!due.late && due.date && due.left <= 60) deadlineBlock.push(h('p', null, due.left === 0 ? '今天是估算的最後一天。' : `還有 ${due.left} 天。`));
    if (dl.law) deadlineBlock.push(h('p', { class: 'law' }, dl.law));
    if (dl.start) deadlineBlock.push(h('p', { class: 'law' }, dl.start));
    if (due.date) {
      const basis = h('a', { href: C.SRC.period[1], target: '_blank', rel: 'noopener noreferrer' }, '法律依據');
      deadlineBlock.push(h('p', { class: 'law small' }, '日期是照法律規定的算法估算的；最後一天如果剛好是假日，這裡沒有往後延（', basis, '）。'));
    }

    const bring = it.bring === false ? null : clean(val(it.bring, ctx));
    const together = it.together ? it.together.ids.filter((id) => ctx.shows(id)) : [];
    const phones = clean(val(it.phones, ctx));

    const toggle = h('button', { type: 'button', class: 'btn ' + (done ? 'btn-secondary' : 'btn-primary') }, done ? '取消打勾' : '做完了，打勾');
    toggle.addEventListener('click', () => {
      if (done) { delete state.done[it.id]; save(); route(); }
      else {
        state.done[it.id] = true; save();
        groupOpen[it.group] = true; returnToRow = it.id;
        go('#/list', true); // 不多留一筆「返回」紀錄 don't add a history entry
      }
    });

    if (it.brief) {
      const importantNode = (() => {
        if (!row.important) return null;
        const t = it.importantText ? it.importantText(ctx, due) : '這一項很重要。';
        return t ? h('p', { class: 'late-msg' }, t) : null;
      })();
      const confirmNode = row.confirm ? h('p', { class: 'confirm-note' }, val(it.confirmText, ctx) || '您在問題裡選了「不確定」，所以先列出來。請先問問家人，或打電話問辦理的單位，確認有沒有這一項；有的話，就要在期限內辦。') : null;
      return viewBrief({ row, it, due, ctx, done, pill, lateNow, importantNode, confirmNode, toggle, phones, built });
    }

    return h('article', { class: 'wrap detail', 'data-item': it.id },
      h('p', { class: 'top-back' }, h('a', { class: 'btn-text', href: '#/list' }, '‹ 回清單')),
      h('h1', null, row.title),
      done ? h('p', { class: 'muted' }, '✓ 已經打勾，做完了') : null,
      pill,
      lateNow,
      (() => {
        if (!row.important) return null;
        const t = it.importantText ? it.importantText(ctx, due) : '這一項很重要。';
        return t ? h('p', { class: 'late-msg' }, t) : null;
      })(),
      row.confirm ? h('p', { class: 'confirm-note' }, val(it.confirmText, ctx) || '您在問題裡選了「不確定」，所以先列出來。請先問問家人，或打電話問辦理的單位，確認有沒有這一項；有的話，就要在期限內辦。') : null,
      section(it.whyTitle || '為什麼要做', blocks(val(it.why, ctx))),
      section('去哪裡辦', blocks(val(it.where, ctx))),
      bring === null ? null : section('要帶什麼', bring.length ? h('ul', null, bring.map((b) => h('li', null, b))) : h('p', null, '官方說明沒有列出。出發前可以先打電話問上面「去哪裡辦」寫的單位。')),
      it.howMany ? section('要申請幾份', blocks(val(it.howMany, ctx))) : null,
      section('期限', deadlineBlock),
      section('辦的時候可以順便一起申請', it.also ? blocks(val(it.also, ctx)) : null),
      section('要注意', it.notes ? blocks(val(it.notes, ctx)) : null),
      together.length ? section(it.together.text, h('ul', null, together.map((id) => {
        const r = built.items.find((x) => x.it.id === id);
        return h('li', null, h('a', { href: '#/item/' + id }, r.title));
      }))) : null,
      phones.length ? section('不清楚的話，可以打電話問', phoneList(phones)) : null,
      h('h2', null, '官方說明'),
      h('ul', { class: 'sources' }, clean(it.sources).map((k) => h('li', null, srcLink(k), h('span', { class: 'date' }, srcDate(C.SRC[k][2]))))),
      h('p', { class: 'small muted' }, `查證日期：${C.VERIFIED_ON}。僅供參考，以官方公告為準。`),
      feedbackNode(feedbackName(it)),
      h('div', { class: 'detail-actions' }, toggle, h('a', { class: 'btn btn-secondary', href: '#/list' }, '回清單'))
    );
  }

  // ===== 詳細頁新版（v3.8） New detail layout =====
  // 要做什麼＋截止日 → 怎麼辦（最多 3 步）→ 為什麼（一句）→ 要注意（最多 3 點）→「看詳細說明」收起來；打勾固定在下方
  // What + deadline → how (≤3 steps) → why (one line) → watch out (≤3) → folded details; done button pinned at the bottom
  // 步驟的欄位 Step fields：h 標題、p 說明（一段或幾段，在清單前面）、ul 清單、more 看情況再帶（moreH 改標題）、
  // after 清單後面的說明、tel 電話（一按就能打）、src 官方連結、go 連到另一項
  function viewBrief(p) {
    const { row, it, due, ctx, done, pill, lateNow, importantNode, confirmNode, toggle, phones, built } = p;
    const B = it.brief;
    const dl = due.dl;
    const titleOf = (id) => { const r = built.items.find((x) => x.it.id === id); return r ? r.title : id; };
    // 還有幾天（和舊版一樣：60 天內才顯示） Days left (shown within 60 days, as before)
    const left = (!due.late && due.date && due.left <= 60)
      ? h('span', { class: 'days-left' }, due.left === 0 ? (due.suggest ? '今天就是建議日期' : '今天是估算的最後一天') : `還有 ${due.left} 天`) : null;
    // 「（估算）」不要從中間斷開 Keep "(estimate)" on one line
    Array.from(pill.childNodes).forEach((n) => {
      if (n.nodeType === 3 && n.textContent.includes('（估算）')) {
        const [x, y] = n.textContent.split('（估算）');
        n.replaceWith(x, h('span', { class: 'nw' }, '（估算）'), y);
      }
    });
    const steps = clean(val(B.steps, ctx)).slice(0, 3);
    const watch = clean(val(B.watch, ctx)).slice(0, 3);
    // 步驟裡已經放的電話、連結，下面就不再重複 Phones and links already shown in a step are not repeated below
    const stepTel = new Set();
    const stepGo = new Set();
    steps.forEach((st) => { clean(st.tel).forEach((k) => stepTel.add(k)); if (st.go) stepGo.add(st.go); });
    const paras = (x, cls) => clean([].concat(x == null ? [] : x)).map((t) => h('p', { class: cls }, t));
    const list = (arr) => h('ul', null, clean(arr).map((x) => h('li', null, x)));
    const stepNode = (st) => h('li', null,
      h('p', { class: 'step-h' }, st.h),
      paras(st.p, 'step-p'),
      st.ul && clean(st.ul).length ? list(st.ul) : null,
      st.more && clean(st.more).length ? h('div', { class: 'step-more' },
        h('p', { class: 'step-more-h' }, st.moreH || '看情況再帶：'), list(st.more)) : null,
      paras(st.after, 'step-p'),
      st.src && C.SRC[st.src] ? h('p', { class: 'step-p' }, srcLink(st.src)) : null,
      st.go && ctx.shows(st.go) ? h('p', { class: 'step-p' }, h('a', { href: '#/item/' + st.go }, `打開「${titleOf(st.go)}」`)) : null,
      clean(st.tel).length ? h('div', { class: 'step-tel' }, phoneList(clean(st.tel))) : null);

    // 看詳細說明裡的一段 One section inside the fold
    const bodyBlocks = (arr) => clean(arr).map((x) => {
      if (typeof x === 'string') return h('p', null, x);
      const lst = x.ol ? h('ol', null, clean(x.ol).map((li) => h('li', null, li))) : list(x.ul);
      return h('div', null, x.h ? h('p', { style: 'font-weight:700;margin-bottom:0' }, x.h) : null, lst);
    });
    const sec = (title, content) => (content && (!Array.isArray(content) || content.length)
      ? h('section', { class: 'more-sec' }, h('h3', null, title), content) : null);
    // 截止日下面那一句（v3.8.1：超過法定期限時，有的項目改用 brief.startLate，null＝不顯示，免得「已超過期限」後面又接「請盡早申請」）
    // v3.8.2：剩 14 天以內、已超過，或所得稅的配偶例外，才放在上面；其他時候收進「看詳細說明」的期限那一段（事實不刪，只換位置）
    // The note under the date: on top only within 14 days, when overdue, or for income tax; otherwise in the fold's deadline section
    const startTxt = (due.late && !due.suggest && B.startLate !== undefined) ? B.startLate : dl.start;
    const startTop = !!startTxt && (START_ALWAYS.has(it.id) || due.late || (!!due.date && due.left <= NEXT_SOON_DAYS));
    const deadlineSec = () => {
      const out = [];
      if (dl.law) out.push(h('p', null, dl.law));
      // 期限從什麼時候開始算（startTxt）：沒有放在上面的話，放在這裡 The start note goes here when it is not on top
      if (startTxt && !startTop) out.push(h('p', null, startTxt));
      clean(val(B.deadlineMore, ctx)).forEach((t) => out.push(h('p', null, t)));
      if (due.date) {
        const basis = h('a', { href: C.SRC.period[1], target: '_blank', rel: 'noopener noreferrer' }, '法律依據');
        out.push(due.suggest
          // v3.8.1：「建議日期」不是法律規定的期限（查財產）A suggested date is not a legal deadline
          ? h('p', { class: 'small muted' }, `建議日期是用過世日期算的${dl.months ? `（過世後 ${dl.months} 個月）` : ''}，不是法律規定的期限。`)
          : h('p', { class: 'small muted' }, '日期是照法律規定的算法（', basis, '）估算的；最後一天如果剛好是假日，這裡沒有往後延。'));
      }
      return sec(B.deadlineTitle || '期限', out);
    };
    const moreSecs = clean(val(B.more, ctx)).map((x) => (x === 'deadline' ? deadlineSec() : sec(x.h, bodyBlocks(val(x.body, ctx)))));
    // 相關的事（連到其他項目） Related items
    const together = it.together ? it.together.ids.filter((id) => ctx.shows(id) && !stepGo.has(id)) : [];
    if (together.length) moreSecs.push(sec(it.together.text, h('ul', null, together.map((id) => h('li', null, h('a', { href: '#/item/' + id }, titleOf(id)))))));
    // 提示字：收起來的地方有相關的事，就寫出來 Mention related items in the hint when they are in the fold
    let hint = val(B.moreHint, ctx) || '';
    // v3.8.1：收起來的地方「相關的事」在「電話」前面，提示字也照這個順序 Same order as the sections: related items come before phones
    if (together.length && !hint.includes('相關')) hint = /(^|、)電話、/.test(hint) ? hint.replace(/(^|、)電話、/, '$1相關的事、電話、')
      : hint.includes('官方說明') ? hint.replace('官方說明', '相關的事、官方說明') : (hint ? hint + '、相關的事' : '相關的事');
    const morePhones = phones.filter((k) => !stepTel.has(k));
    if (morePhones.length) moreSecs.push(sec('不清楚的話，可以打電話問', h('div', { class: 'phones-in' }, phoneList(morePhones))));
    moreSecs.push(sec('官方說明', [
      h('ul', { class: 'sources' }, clean(it.sources).map((k) => h('li', null, srcLink(k), h('span', { class: 'date' }, srcDate(C.SRC[k][2]))))),
      h('p', { class: 'small muted' }, `查證日期：${C.VERIFIED_ON}。`)
    ]));

    // 聲明和回報縮成一行 Disclaimer and feedback in one short line
    const fb = feedbackHref(feedbackName(it));
    let filled = false; // 有沒有真的先填好「哪一頁」 whether the page name is really pre-filled
    try { const k = C.FEEDBACK.whereEntry; filled = !!fb && /^entry\.\d+$/.test(k || '') && new URL(fb).searchParams.has(k); } catch (e) { filled = false; }
    const foot = h('p', { class: 'brief-foot small muted' }, '僅供參考，以官方公告為準。',
      fb ? h('span', { class: 'feedback' }, h('a', { href: fb, target: '_blank', rel: 'noopener noreferrer' }, '回報錯誤或過時的資料'),
        filled ? '（會打開 Google 表單，是另一個網站；已經先填好是哪一頁；您在這個工具裡的回答不會送出去）'
          : '（會打開 Google 表單，是另一個網站；您在這個工具裡的回答不會送出去）') : null);

    const why = val(B.why, ctx);
    return h('article', { class: 'wrap detail brief', 'data-item': it.id },
      h('p', { class: 'top-back' }, h('a', { class: 'btn-text', href: '#/list' }, '‹ 回清單')),
      h('h1', null, row.title),
      done ? h('p', { class: 'muted' }, '✓ 已經打勾，做完了') : null,
      h('div', { class: 'due-line' }, pill, left),
      // 超過期限的紅字先 The overdue message first
      lateNow,
      // 期限從什麼時候開始算、有沒有例外（例如從知道自己是繼承人那天起算），放在截止日（和紅字）下面
      // When the period starts and its exceptions, right under the date (and the overdue message)
      startTop ? h('p', { class: 'start-note' }, startTxt) : null, // v3.8.2：條件見上面 startTop see startTop above
      importantNode, confirmNode,
      h('section', { class: 'how', 'aria-labelledby': 'how-h' },
        h('h2', { id: 'how-h' }, '怎麼辦'),
        h('ol', { class: 'steps' }, steps.map(stepNode))),
      why ? h('p', { class: 'why-line' }, h('b', null, '為什麼：'), why) : null,
      watch.length ? h('section', { class: 'watch', 'aria-labelledby': 'watch-h' },
        h('h2', { id: 'watch-h' }, '要注意'),
        list(watch)) : null,
      // 讀螢幕軟體才看得到的標題，讓下面的小標不會被當成「要注意」的一部分 Screen-reader-only heading for the fold
      h('h2', { class: 'sr-only' }, '詳細說明'),
      h('details', { class: 'more' },
        h('summary', null,
          h('span', null, '看詳細說明', hint ? h('span', { class: 'more-hint' }, hint) : null),
          h('span', { class: 'plus', 'aria-hidden': 'true' }, '＋')),
        moreSecs),
      foot,
      // 打勾固定在畫面下方，不用滑到底 Done button pinned to the bottom of the screen
      h('div', { class: 'done-bar' }, h('div', { class: 'in' }, toggle))
    );
  }

  // 匯出（列印、PDF）時拿掉指向畫面連結的括號說明 Drop "see the link below" asides on paper
  const forPaper = (t) => t.replace(/（下面「官方說明」[^）]*）/g, '');

  // ===== 列印 Print =====
  function buildPrint(built) {
    const area = document.getElementById('printArea');
    const { groups, donts, ctx } = built;
    const t = D.today();
    area.replaceChildren(h('div', null,
      h('h1', null, '身後通：待辦清單'),
      h('p', null, `依過世日期 ${D.fmtPlain(ctx.a.date)} 估算，製作日期 ${D.fmtPlain(t)}。僅供參考，以官方公告為準；最後一天如果是假日，這裡沒有往後延，請不要等到最後一天。`),
      donts.length ? [h('h2', null, '先不要做'), h('ul', null, donts.map((d) => h('li', null, d.title, h('br'), '為什麼：' + d.why)))] : null,
      groups.map(({ g, rows }) => [
        h('h2', null, g.title),
        rows.map((r) => {
          // 已完成的只留標題 Done items: title only
          if (state.done[r.it.id]) return h('div', { class: 'p-item' }, h('div', { class: 'p-title' }, h('span', { class: 'p-box' }, '✓'), '（已完成）' + r.title));
          const line = dueLine(r.due, true);
          const bring = r.it.bring === false ? [] : clean(val(r.it.bring, ctx));
          const where = clean(val(r.it.where, ctx)).filter((x) => typeof x === 'string').map(forPaper);
          return h('div', { class: 'p-item' },
            h('div', { class: 'p-title' }, h('span', { class: 'p-box' }, ''), r.title + tagText(r)),
            h('div', { class: 'p-meta' },
              h('div', null, line.text),
              where.length ? h('div', null, '去哪裡辦：' + where.join(' ')) : null,
              bring.length ? [h('div', null, '要帶：'), h('ul', null, bring.map((b) => h('li', null, b)))] : null));
        })
      ]),
      h('h2', null, '電話'),
      h('ul', null, printPhoneKeys(built).map((k) => h('li', null, `${C.PHONES[k].name}：${C.PHONES[k].show}`))),
      h('p', null, `內容查證日期：${C.VERIFIED_ON}。這是個人製作的參考工具，不是政府網站，也不是法律意見；有問題請自行詢問律師、地政士（代書）或辦理單位。`)
    ));
  }
  function doPrint(built) {
    buildPrint(built);
    if (typeof window.print === 'function') {
      try { window.print(); } catch (e) { logError('列印失敗：' + e.message); }
    }
  }
  window.addEventListener('beforeprint', () => {
    if (answersComplete(state.answers)) buildPrint(buildList(state.answers));
  });

  // ===== 存成 PDF，拿去超商印 Save as PDF for convenience-store printing =====
  // PDF 在手機裡直接產生（把清單畫成 A4 圖片再包成 PDF），不會上傳到任何地方。
  // The PDF is generated on the device (list drawn as A4 images, wrapped into a PDF); nothing is uploaded.
  const PDF_FILENAME = '身後通_待辦清單.pdf';
  const A4 = { w: 1240, h: 1754, margin: 96 }; // A4，每英吋 150 點 A4 at 150 dpi
  const PDF_FONT = '"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",system-ui,sans-serif';

  // 依寬度換行（中文一個字一個字量） Wrap text by measured width, character by character
  // 不可以從中間切開的片段：電話、日期、數字（連同後面的一個字）、英文 Pieces that must not be split
  const WRAP_UNITS = /\(\d{2,4}\) ?[\d-]+|\d{4}年\d{1,2}月\d{1,2}日|\d[\d,.:\/-]*(?: [\u3400-\u9fff])?|[A-Za-z@][0-9A-Za-z@.,:\/%_-]*|[\s\S]/gu;
  function wrapText(ctx, text, maxW) {
    const out = []; let line = '';
    // 一段比一整行還長（很少見）：只好一個字一個字切 A piece longer than a whole line: split by character
    const pushLong = (tok) => {
      for (const ch of Array.from(tok)) {
        const t = line + ch;
        if (ctx.measureText(t).width > maxW && line) { out.push(line); line = ch; } else line = t;
      }
    };
    for (const tok of String(text).match(WRAP_UNITS) || []) {
      if (tok === '\n') { out.push(line); line = ''; continue; }
      const test = line + tok;
      if (ctx.measureText(test).width > maxW && line) {
        // 標點不要放在行首 Keep closing punctuation off the start of a line
        if ('，。、；：）」』！？'.includes(tok)) { out.push(test); line = ''; continue; }
        if (ctx.measureText(tok).width > maxW) { pushLong(tok); continue; }
        out.push(line.replace(/ +$/, '')); line = tok === ' ' ? '' : tok;
      } else line = test;
    }
    if (line) out.push(line);
    return out;
  }

  function buildPdfCanvases(built) {
    const { groups, donts, ctx: c } = built;
    const pages = [];
    let cv, g, y;
    const W = A4.w - A4.margin * 2, bottom = A4.h - A4.margin - 40;
    const newPage = () => {
      cv = document.createElement('canvas'); cv.width = A4.w; cv.height = A4.h;
      g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, A4.w, A4.h);
      g.textBaseline = 'top'; y = A4.margin; pages.push(cv);
    };
    const font = (size, bold) => { g.font = `${bold ? '700 ' : ''}${size}px ${PDF_FONT}`; };
    // 先量高度，放不下就換頁 Measure first; start a new page if it doesn't fit
    const block = (parts, gapAfter) => {
      let hgt = 0;
      const laid = parts.map((p) => {
        font(p.size, p.bold);
        const lines = wrapText(g, p.text, W - (p.indent || 0));
        const lh = Math.round(p.size * 1.5);
        hgt += lines.length * lh + (p.after || 0);
        return { ...p, lines, lh };
      });
      if (y + hgt > bottom && y > A4.margin) newPage();
      for (const p of laid) {
        font(p.size, p.bold); g.fillStyle = p.color || '#111';
        if (p.box) {
          const bx = A4.margin, by = y + p.size * 0.2, bs = p.size * 0.95;
          g.strokeStyle = '#111'; g.lineWidth = 3; g.strokeRect(bx, by, bs, bs);
          if (p.checked) { g.beginPath(); g.moveTo(bx + bs * 0.2, by + bs * 0.55); g.lineTo(bx + bs * 0.42, by + bs * 0.78); g.lineTo(bx + bs * 0.82, by + bs * 0.25); g.lineWidth = 4; g.stroke(); }
        }
        p.lines.forEach((ln, i) => { g.fillText(ln, A4.margin + (p.indent || 0), y + i * p.lh); });
        y += p.lines.length * p.lh + (p.after || 0);
      }
      y += gapAfter || 0;
    };
    const rule = () => { g.strokeStyle = '#999'; g.lineWidth = 2; g.beginPath(); g.moveTo(A4.margin, y); g.lineTo(A4.w - A4.margin, y); g.stroke(); y += 18; };

    newPage();
    block([
      { text: '身後通：待辦清單', size: 52, bold: true, after: 12 },
      { text: `依過世日期 ${D.fmtPlain(c.a.date)} 估算，製作日期 ${D.fmtPlain(D.today())}。`, size: 28, color: '#333' },
      { text: '僅供參考，以官方公告為準；最後一天如果是假日，這裡沒有往後延，請不要等到最後一天。', size: 28, color: '#333' }
    ], 20);
    rule();
    if (donts.length) {
      block([{ text: '先不要做', size: 38, bold: true }], 6);
      donts.forEach((d) => block([
        { text: '・' + d.title, size: 30, bold: true },
        { text: '為什麼：' + d.why, size: 27, color: '#333', indent: 34 }
      ], 12));
      rule();
    }
    groups.forEach(({ g: grp, rows }) => {
      // 組名和第一項放在同一頁 Keep the group heading with its first item
      const heading = { text: grp.title + (grp.sub ? `（${grp.sub}）` : ''), size: 38, bold: true, after: 12 };
      rows.forEach((r, ri) => {
        const line = dueLine(r.due, true); // 不寫「還有幾天」 no "days left" in exports
        const done = !!state.done[r.it.id];
        const where = done ? [] : clean(val(r.it.where, c)).filter((x) => typeof x === 'string').map(forPaper);
        const bring = (done || r.it.bring === false) ? [] : clean(val(r.it.bring, c));
        const parts = [
          { text: (done ? '（已完成）' : '') + r.title + tagText(r), size: 32, bold: true, indent: 50, box: true, checked: done, after: 2 }
        ];
        // 已完成的只留標題 Done items: title only
        if (!done) parts.push({ text: line.text, size: 27, color: '#222', indent: 50 });
        if (ri === 0) parts.unshift(heading);
        if (where.length) parts.push({ text: '去哪裡辦：' + where.join(''), size: 27, color: '#222', indent: 50 });
        // 要帶的東西一行一項 One item per line
        if (bring.length) {
          parts.push({ text: '要帶：', size: 27, color: '#222', indent: 50 });
          bring.forEach((b) => parts.push({ text: '・' + b, size: 27, color: '#222', indent: 80 }));
        }
        block(parts, 22);
      });
      rule();
    });
    const phoneKeys = printPhoneKeys(built);
    if (phoneKeys.length) {
      block([{ text: '不清楚的話，可以打這些電話問', size: 34, bold: true }], 4);
      phoneKeys.forEach((k) => block([{ text: `${C.PHONES[k].name}：${C.PHONES[k].show}`, size: 28 }], 2));
    }
    block([{ text: `內容查證日期：${C.VERIFIED_ON}。這是個人製作的參考工具，不是政府網站，也不是法律意見；有問題請自行詢問律師、地政士（代書）或辦理單位。`, size: 24, color: '#444' }], 0);

    // 頁尾頁碼 Page numbers
    pages.forEach((p, i) => {
      const gg = p.getContext('2d');
      gg.font = `24px ${PDF_FONT}`; gg.fillStyle = '#555'; gg.textBaseline = 'top';
      const t = `身後通　第 ${i + 1} 頁，共 ${pages.length} 頁`;
      gg.fillText(t, A4.w - A4.margin - gg.measureText(t).width, A4.h - A4.margin + 8);
    });
    return pages;
  }

  function jpegBytes(canvas) {
    const b64 = canvas.toDataURL('image/jpeg', 0.88).split(',')[1];
    const bin = atob(b64); const u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  }

  // 最簡單的 PDF：每頁一張 JPEG 圖 Minimal PDF writer: one JPEG image per A4 page
  function makePdf(imgs) {
    const enc = new TextEncoder(); const chunks = []; let len = 0; const offs = [];
    const push = (x) => { const b = typeof x === 'string' ? enc.encode(x) : x; chunks.push(b); len += b.length; };
    const obj = (num, write) => { offs[num] = len; push(`${num} 0 obj\n`); write(); push('\nendobj\n'); };
    push('%PDF-1.4\n'); push(new Uint8Array([0x25, 0xE2, 0xE3, 0xCF, 0xD3, 0x0A]));
    const n = imgs.length;
    obj(1, () => push('<< /Type /Catalog /Pages 2 0 R >>'));
    obj(2, () => push(`<< /Type /Pages /Kids [${imgs.map((_, i) => `${3 + 3 * i} 0 R`).join(' ')}] /Count ${n} >>`));
    imgs.forEach((im, i) => {
      const p = 3 + 3 * i, x = 4 + 3 * i, ct = 5 + 3 * i;
      obj(p, () => push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im${i} ${x} 0 R >> >> /Contents ${ct} 0 R >>`));
      obj(x, () => { push(`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`); push(im.bytes); push('\nendstream'); });
      const content = `q 595.28 0 0 841.89 0 0 cm /Im${i} Do Q`;
      obj(ct, () => push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`));
    });
    const xref = len, total = 3 + 3 * n;
    push(`xref\n0 ${total}\n0000000000 65535 f \n`);
    for (let k = 1; k < total; k++) push(String(offs[k]).padStart(10, '0') + ' 00000 n \n');
    push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
    const out = new Uint8Array(len); let o = 0;
    for (const ch of chunks) { out.set(ch, o); o += ch.length; }
    return out;
  }

  function buildListPdf(built) {
    const pages = buildPdfCanvases(built);
    return { bytes: makePdf(pages.map((cv) => ({ bytes: jpegBytes(cv), w: cv.width, h: cv.height }))), pages: pages.length };
  }

  // 存檔：試用連結用平台的下載功能；自己的檔案用一般下載
  // Save: inside a claude.ai artifact use the downloads capability; otherwise a normal download link
  async function saveFile(filename, bytes, mime) {
    const blob = new Blob([bytes], { type: mime });
    if (window.claude && typeof window.claude.use === 'function') {
      let dl = null;
      try { dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
      if (dl) {
        try { await dl.save({ filename, data: blob }); return 'saved'; }
        catch (e) { return e && (e.code === 'declined' || e.code === 'rate_limited') ? 'declined' : 'failed'; } // 使用者按了不要，或視窗還開著 viewer said no, or a prompt is already open
      }
      if (window.self !== window.top) return 'unavailable'; // 試用連結沒有開下載權限 artifact without downloads
    }
    try {
      const url = URL.createObjectURL(blob);
      const a = h('a', { href: url, download: filename, style: 'display:none' });
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      return 'saved';
    } catch (e) { return 'failed'; }
  }

  // 在 LINE 內建瀏覽器裡（下載常常存不下來）In LINE's in-app browser downloads often fail silently
  const IN_LINE = /\bLine\//i.test(navigator.userAgent || '');

  async function doPdf(built, btn) {
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = '正在做 PDF…';
    let status = 'failed', pages = 0;
    try {
      await new Promise((r) => setTimeout(r, 30)); // 先讓按鈕文字更新 let the label repaint
      const out = buildListPdf(built); pages = out.pages;
      status = await saveFile(PDF_FILENAME, out.bytes, 'application/pdf');
    } catch (e) { logError('PDF 產生失敗：' + e.message, false); status = 'failed'; }
    btn.disabled = false; btn.textContent = label;
    // 按鈕停用時會失去焦點；先放回去，對話框關掉後才回得來
    // A disabled button loses focus; restore it so closing the dialog returns here
    if (btn.isConnected) btn.focus({ preventScroll: true });
    if (status === 'saved') {
      state.pdfSaved = true; save();
      // 不重畫整個清單（對話框關掉後焦點要回到按鈕），直接把按鈕插在後面
      // Insert the button without re-rendering, so focus can return to the PDF button
      if (!document.getElementById('storeAgainBtn') && btn.isConnected) btn.after(storeAgainBtn());
    }
    openStoreDialog(status, pages, built, btn);
  }

  // 「再看超商列印步驟」：只看步驟，不重新存檔 Re-open the store steps without saving again
  function storeAgainBtn() {
    return h('button', { type: 'button', class: 'btn btn-secondary', id: 'storeAgainBtn', onclick: () => openStoreDialog('info', 0, null, null) }, '再看超商列印步驟');
  }

  function openStoreDialog(status, pages, built, btn) {
    const ext = (url, text) => h('a', { href: url, target: '_blank', rel: 'noopener noreferrer' }, text);
    // 開頭：存檔結果 Top: what happened with the save
    let head;
    if (status === 'saved') head = [
      h('p', null, `PDF 已經做好了（${pages} 頁，檔名「${PDF_FILENAME}」）。手機如果問要不要下載，請按「下載」。`),
      IN_LINE ? h('p', { class: 'confirm-note small' }, '您現在是在 LINE 裡面打開這個網頁，PDF 可能存不下來。找不到 PDF 的話，請改用 Safari 或 Chrome 打開這個網頁，再存一次。') : null
    ];
    else if (status === 'unavailable') head = h('p', { class: 'error', role: 'alert' }, '這個試用連結沒辦法存檔。可以先用清單下面的「傳給家人」，把文字複製起來。');
    else if (status === 'info') head = [h('p', null, '照下面的步驟，把存好的 PDF 拿去超商印。'),
      h('p', { class: 'small muted' }, '之後如果有打勾或改過回答，請再按一次「存成 PDF，拿去超商印」，印出來才是最新的。')];
    else head = h('p', { class: 'error', role: 'alert' }, status === 'declined'
      ? '剛剛沒有存檔。需要的話，可以按「再存一次」。'
      : '沒有存成功。可以再試一次；還是不行的話，請改用 Safari 或 Chrome 打開這個網頁再試。');
    const retry = (status === 'declined' || status === 'failed') && built && btn
      ? h('div', { class: 'q-actions' }, h('button', { type: 'button', class: 'btn btn-primary', onclick: () => { closeModal(); doPdf(built, btn); } }, '再存一次'))
      : null;
    // PDF 存在哪裡 Where the PDF went
    const where = status === 'failed' || status === 'declined' || status === 'unavailable' ? null : h('div', { class: 'where-box small' },
      h('p', null, h('strong', null, 'PDF 存在哪裡？'), '通常在手機的「檔案」App，或「下載」資料夾裡。'),
      // 在 LINE 裡時上面已經提醒過，這裡不重複 Already warned above when inside LINE
      IN_LINE ? null : h('p', null, '如果是在 LINE 裡面打開這個網頁、找不到存好的 PDF，請改用 Safari 或 Chrome 打開這個網頁，再存一次。'));

    // 各家超商的步驟 Steps per store（只寫查得到官方說明的 only stores with official instructions）
    const STEPS = {
      '711': () => [
        h('h3', { class: 'store', tabindex: '-1' }, '7-ELEVEN（ibon）的步驟'),
        h('ol', { class: 'steps' },
          h('li', null, '打開', ext('https://print.ibon.com.tw/ibonprinter', '「ibon 雲端列印網」'), '，上傳存好的 PDF。'),
          h('li', null, '上傳後會拿到一組「取件編號」，請記下來或截圖。'),
          h('li', null, '到 7-ELEVEN 的 ibon 機台，選「列印掃描」→「ibon文件下載列印」，輸入取件編號就能印。')),
        h('p', { class: 'small muted' }, '也可以把 PDF 用電子郵件寄到 ibon@ibon.com.tw，回信裡會有取件編號；用電子郵件寄的，取件編號從上傳起 3 天（72 小時）內有效。用網站上傳的有效時間，以上傳後畫面顯示為準。費用以機台顯示為準。'),
        h('p', { class: 'small muted' }, '資料來源：', ext('https://www.ibon.com.tw/printscan_ie.aspx', 'ibon 列印掃描說明'), `（${STORE_VERIFIED} 查證）`)
      ],
      fami: () => [
        h('h3', { class: 'store', tabindex: '-1' }, '全家（My FamiPort）的步驟'),
        h('ol', { class: 'steps' },
          h('li', null, '打開全家的「My FamiPort」App，用「雲端列印」上傳存好的 PDF。'),
          h('li', null, '再照 App 的說明，在全家門市印出來。')),
        h('p', { class: 'small muted' }, '費用和有效時間，以 App 和門市機台顯示為準。'),
        h('p', { class: 'small muted' }, '資料來源：', ext('https://apps.apple.com/us/app/my-famiport/id926152183', 'My FamiPort App 說明'), `（${STORE_VERIFIED} 查證）`)
      ]
    };
    const stepsBox = h('div', { class: 'store-steps', id: 'storeSteps' });
    const pickBtns = {};
    const pick = (id, moveFocus) => {
      state.store = id; save();
      for (const [k, b] of Object.entries(pickBtns)) b.setAttribute('aria-pressed', String(k === id));
      stepsBox.replaceChildren(...STEPS[id]());
      if (moveFocus) {
        const h3 = stepsBox.querySelector('h3');
        h3.focus({ preventScroll: true });
        h3.scrollIntoView({ block: 'start', behavior: 'smooth' });
      }
    };
    const mk = (id, name, sub) => {
      const b = h('button', { type: 'button', class: 'btn btn-store', 'data-store': id, 'aria-pressed': 'false', 'aria-controls': 'storeSteps' },
        h('span', { class: 'picked', 'aria-hidden': 'true' }, '✓ 已選'), h('span', null, name), h('span', { class: 'sub' }, sub));
      b.addEventListener('click', () => pick(id, true));
      pickBtns[id] = b;
      return b;
    };

    openModal('拿去超商印',
      head, retry, where,
      h('h3', { class: 'pick' }, '要去哪一家超商印？'),
      h('div', { class: 'store-pick' }, mk('711', '7-ELEVEN', 'ibon'), mk('fami', '全家', 'My FamiPort App')),
      stepsBox,
      h('p', { class: 'small' }, '萊爾富、OK：沒有查到官方的雲端列印說明，所以這裡沒有列出步驟。這份 PDF 在任何能印 PDF 的地方都可以印。'),
      h('p', { class: 'confirm-note small' }, '提醒：上傳以後，檔案會存在超商的列印系統裡。檔案裡有過世日期和待辦清單，取件編號不要給不相關的人。'),
      h('div', { class: 'q-actions' }, h('button', { type: 'button', class: 'btn btn-secondary', onclick: closeModal }, '關閉')));
    // 上次選過的超商直接顯示 Show the store picked last time
    if (state.store) pick(state.store, false);
  }

  // ===== 分享 Share =====
  function shareText(built) {
    const { groups, donts, ctx } = built;
    const lines = ['身後通：待辦清單', `（依過世日期 ${D.fmtPlain(ctx.a.date)} 估算，製作日期 ${D.fmtPlain(D.today())}；僅供參考，以官方公告為準）`, ''];
    if (donts.length) { lines.push('【先不要做】'); donts.forEach((d) => lines.push('・' + d.title)); lines.push(''); }
    groups.forEach(({ g, rows }) => {
      lines.push(`【${g.title}】`);
      rows.forEach((r) => {
        // 已完成的只留標題 Done items: title only
        if (state.done[r.it.id]) { lines.push(`☑ （已完成）${r.title}`); return; }
        const line = dueLine(r.due, true); // 不寫「還有幾天」 no "days left"
        lines.push(`□ ${r.title}${tagText(r)}｜${line.text}`);
      });
      lines.push('');
    });
    lines.push('這是個人製作的參考工具，不是政府網站，也不是法律意見；有問題請自行詢問律師、地政士（代書）或辦理單位。');
    return lines.join('\n').trim();
  }
  async function doShare(built) {
    const text = shareText(built);
    if (navigator.share) {
      try { await navigator.share({ title: '身後通：待辦清單', text }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; /* 其他錯誤改用複製 fallback to copy */ }
    }
    openShareDialog(text);
  }
  function openShareDialog(text) {
    const ta = h('textarea', { readonly: true, 'aria-label': '清單文字' }, text);
    const status = h('p', { role: 'status', class: 'small muted' }, '');
    openModal('把清單傳給家人',
      h('p', null, '按「複製文字」，再到 LINE 或簡訊裡「貼上」就可以了。'),
      ta, status,
      h('div', { class: 'btn-row', style: 'margin-top:.8em' },
        h('button', { type: 'button', class: 'btn btn-primary', onclick: async () => {
          const ok = await copyText(text);
          if (!ok) { ta.focus(); ta.select(); }
          status.textContent = ok ? '已複製，可以去貼上了。' : '沒辦法自動複製，文字已經選好，請長按後選「拷貝」或「複製」。';
        } }, '複製文字'),
        h('button', { type: 'button', class: 'btn btn-secondary', onclick: closeModal }, '關閉')));
  }
  async function copyText(text, toast) {
    try {
      if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); if (toast) alertInline(toast); return true; }
    } catch (e) { /* 改用舊方法 fall back */ }
    try {
      const ta = h('textarea', { style: 'position:fixed;top:-1000px;opacity:0' }, text);
      document.body.append(ta); ta.select();
      const ok = document.execCommand('copy'); ta.remove();
      if (ok && toast) alertInline(toast);
      return ok;
    } catch (e) { return false; }
  }
  function alertInline(msg) {
    const bar = document.getElementById('errorBar');
    if (!bar.hidden) { const p = h('p', { class: 'small', style: 'margin:.4em 0 0;font-weight:700' }, msg); bar.querySelector('.in').append(p); }
  }

  // ===== 對話框 Dialog（不用瀏覽器的 alert／confirm） =====
  let lastFocus = null;
  function openModal(title, ...content) {
    lastFocus = document.activeElement;
    const root = document.getElementById('modalRoot');
    const box = h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'modal-title' },
      h('h2', { id: 'modal-title', tabindex: '-1' }, title), content);
    const bg = h('div', { class: 'modal-bg' }, box);
    bg.addEventListener('click', (e) => { if (e.target === bg) closeModal(); });
    root.replaceChildren(bg);
    // 對話框打開時，後面的畫面不能操作 Make the page behind inert while the dialog is open
    for (const id of ['main', 'errorBar']) { const el = document.getElementById(id); if (el) el.setAttribute('inert', ''); }
    const tb = document.querySelector('.topbar'); if (tb) tb.setAttribute('inert', '');
    box.querySelector('h2').focus();
  }
  function closeModal() {
    const root = document.getElementById('modalRoot');
    if (!root.firstChild) return;
    root.replaceChildren();
    for (const id of ['main', 'errorBar']) { const el = document.getElementById(id); if (el) el.removeAttribute('inert'); }
    const tb = document.querySelector('.topbar'); if (tb) tb.removeAttribute('inert');
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  }
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeModal(); return; }
    // 鍵盤 Tab 只在對話框裡面循環 Keep Tab focus inside the dialog
    if (e.key === 'Tab') {
      const box = document.querySelector('#modalRoot .modal');
      if (!box) return;
      const f = Array.from(box.querySelectorAll('a[href],button:not([disabled]),textarea,input,select,[tabindex]:not([tabindex="-1"])'));
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && (document.activeElement === first || !box.contains(document.activeElement))) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  function confirmClear() {
    openModal('要清除回答和打勾紀錄嗎？',
      h('p', null, '會清除這支手機上的回答和打勾紀錄，清除後沒辦法復原。'),
      h('div', { class: 'btn-row', style: 'margin-top:.8em' },
        h('button', { type: 'button', class: 'btn btn-secondary', onclick: closeModal }, '不要清除'),
        h('button', { type: 'button', class: 'btn btn-danger', onclick: () => {
          state = { answers: {}, done: {}, scale: state.scale };
          save(); closeModal(); go('#/start');
        } }, '確定清除')));
  }

  // ===== 啟動 Start =====
  if (!document.documentElement.lang) document.documentElement.lang = 'zh-Hant-TW';
  load();
  applyScale();
  window.addEventListener('hashchange', route);
  route();

  // 給自動測試用的唯讀介面 Read-only hooks for automated tests
  window.__SHD__ = { D, buildList, shareText, makeCtx, buildListPdf, wrapText, pickNext };
})();
</script>
